<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空家マップ｜管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- TODO: 本番移行時に本番キー(js-api 本番ドメイン)へ差し替え。現状は検証環境キー(test-js)。 -->
  <script src="https://test-js.zmaps-api.com/zma_loader.js?key=2xYL6LK8wxaJGUxZ8rwdD9rv4sHGXXX51pD8tLUW&auth=referer"></script>

  <!-- SheetJS (xlsx): Excel出力に使用。グローバル XLSX を定義する -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, addDoc, updateDoc, deleteDoc, doc, deleteField, onSnapshot, query, orderBy, runTransaction, serverTimestamp, setDoc, writeBatch, arrayUnion }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDloqlUX051jReuAW4_TyncQgGlk03CfO0",
      authDomain: "housemarket-map.firebaseapp.com",
      projectId: "housemarket-map",
      storageBucket: "housemarket-map.firebasestorage.app",
      messagingSenderId: "182625011825",
      appId: "1:182625011825:web:a5f7c989e94a426d5373d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let map = null;
    let allPins = [];
    let pinWidgetMap = new Map();   // pinId -> {marker, labelWidget}。差分更新のため配列ではなくMapで持つ
    // filtered() の結果キャッシュ（地図描画専用）。idle のたびに 5694件×8条件を回さないために持つ。
    // 更新者は renderList() ただ1つ。フィルタを変える set* ハンドラは全て renderList() を必ず呼ぶため
    // これで同期が保てる（※将来 renderList() を経由しないフィルタ変更を足す場合はここも更新すること）。
    // Excel出力/全選択/一括削除は従来どおり filtered() を直接呼ぶ＝集合の基準は変えない。
    let filteredPins = [];
    // ===== 描画コスト制御（第一便：番号ラベルのズーム制限）=====
    // 端末の重さは「地図に載っているウィジェット数」にほぼ比例する。
    // #001ラベルを畳むと 1ピン=2ウィジェット → 1ウィジェットになり、広域表示が軽くなる。
    const LABEL_MIN_ZOOM      = 16;     // #001番号ラベルを描き始めるズーム（index.html と同値）
    // 初期ズーム。カリング導入で描画量は「総ピン数」ではなく「画面内の密度」で決まるようになったため、
    // Z16未満に留める必要がなくなった。Z18(≒50m)は Z16 に対して面積1/16＝描画対象も概ね1/16で、
    // 立ち上がりと現地の視認性を優先してここに置く（index.html の DEFAULT_ZOOM と同値）。
    // LABEL_MIN_ZOOM(16)以上なので #001番号ラベルは初期から出る（事務員の照合運用に合わせる）。
    const ADMIN_DEFAULT_ZOOM  = 18;
    let   labelsShown         = false;  // 直近の renderAllMarkers が実際にラベルを描いたか（閾値跨ぎの検出用）
    let reviewOnly = false;     // 「⚠️ 要調査のみ」フィルタ（赤ラベル＝住所不明 or 地番未取得 だけ表示）
    let activeStaffFilter = "all";
    let activeDateFilter = "all";
    let activeGroupFilter = "all";   // 上部カウンターのグループ絞り（all|building|land|ng）。ハイライトにも使用
    let activeStatusFilter = "all";  // ステータスDDの個別分類絞り（all|STATUSキー）。カウンターとAND併用
    let otherCompanyFilter = "all";  // 他社物件フィルタ（all|exclude|only）。既存フィルタと全てAND併用
    let activeAreaFilter = "all";    // エリア（市区町村）絞り（all|areaKey）。既存フィルタとAND併用
    let activeRoundFilter = "all";   // 周回絞り（all|数値）。NG系(永久)は周回で消えない
    let searchQuery = "";       // 左リスト検索（No/住所/地番の部分一致）
    let checkedIds = new Set();
    let selectedPinId = null;
    let myBranch = "名古屋";     // ログイン管理者の所属店(displayNames[email].branch)。読取前は名古屋を既定に。
    let isAdminUser = false;    // admins/{uid} 存在＝管理者。周回管理UIの表示可否に使う（fail-closed・既定false）
    // 反社/NG登録（管理画面専用）
    let regMode = false;        // 地図クリックで反社/NG登録するモード
    let regStatus = "hansha";   // 登録ステータス（hansha/ng）
    let lastGeoLatLng = null;   // 直近ジオコード座標（住所からの登録用）
    let regTempMarker = null;   // 一時マーカー（登録前の仮位置）

    // ===== 公図取得済みマーク（kouzu_marks）— 管理画面専用 =====
    // 地番レイヤで地番が取得できず「公図」を法務局/登記情報提供サービスで取得したエリアの記録。
    // 二重取得の防止が目的。調査員(index.html)には購読・描画とも一切追加しない（rules の read も isAdmin）。
    const KOUZU_COLOR = "#06B6D4";  // 専用色。反社#1F2937 / NG#6B7280 / 要確認#EF4444 / staff色と重複なし
    let kouzuMode  = false;   // 地図クリックで公図マークを登録するモード（反社/NG登録と排他）
    // 表示は既定OFF。京都は数百件あり、起動時に全チップを描くと初期表示が重い（実機確認済み）。
    // 購読(listenKouzuMarks)は従来どおり走らせる＝トグルONの瞬間に取得待ちを出さない。
    let kouzuOn    = false;   // 公図マークの表示ON/OFF（既定OFF・手動ON運用）
    let kouzuMarks = [];      // Firestoreミラー（自店分のみ）
    let kouzuWidgets = [];    // 地図ウィジェット。markers とは別配列＝ピン再描画で消えない
    let kouzuPending = null;  // 登録モーダルで保留中の座標 {lat,lng}

    // ===== 要確認(赤)判定 — 単一真実 =====
    // 赤＝住所が要確認 or 地番が未取得。index.html と同一定義（色基準を統一）。
    // 表示はこの計算値を真実とし、手補正時に needsReview フラグへ同値を書いて整合させる。
    function isAddrUnknown(p) {
      const a = (p.address || "").trim();
      return !a || a === "住所不明" || a === "（オフライン）" || a === "取得中…" || a === "住所取得中…";
    }
    // 永久ピン（反社/NG）：周回・日付フィルタ例外／削除不可／専用色。status キーで判定。
    const PERMANENT_COLOR = "#374151";
    function isPermanentPin(p) { return p.status === "hansha" || p.status === "ng"; }
    function isChibanMissing(p) {
      if (isPermanentPin(p)) return false;   // 反社/NGは地番レビュー対象外＝地番未取得でも赤にしない
      return !(p.chiban && String(p.chiban).trim());
    }
    function needsReviewNow(p) {
      return isAddrUnknown(p) || isChibanMissing(p);
    }
    // 表示専用: 計算上の要確認に加え、保存済 needsReview(参考地番等)も赤に。
    // ※再計算・書き戻し(手補正)は needsReviewNow のまま。表示・フィルタだけがこの拡張を使う。
    function isReviewFlagged(p) {
      return needsReviewNow(p) || p.needsReview === true;
    }
    // input value="" 属性に安全に埋めるための最小エスケープ
    function escAttr(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    // ===== 調査グリッド(MVP) 状態 — 管理画面は表示専用（俯瞰のみ・タップ編集なし） =====
    let gridMode = false;       // グリッド進捗オーバーレイの表示ON/OFF（初期OFF）
    let gridWidgets = [];       // グリッド線＋塗りのZDCウィジェット（markersとは別管理）
    let surveyedCells = {};     // gridId -> Firestoreミラー（調査済みマス）

    // 全12種。index.html と同一のキー・ラベル・色で統一。
    // ※他社所有/媒介は STATUS ではなく pin.otherCompany(boolean) で持つ（状態と独立の属性）。
    const STATUS = {
      // 建物系
      akiya:   { label: "空家",   color: "#3B82F6" },
      chikuko: { label: "築古",   color: "#6366F1" },
      haikyo:  { label: "廃墟",   color: "#A855F7" },
      renpei:  { label: "連棟",   color: "#8B5CF6" },
      shueki:  { label: "収益",   color: "#0EA5E9" },
      souko:   { label: "倉庫",   color: "#64748B" },
      // 土地系
      sarachi: { label: "更地",   color: "#10B981" },
      zasshu:  { label: "雑種地", color: "#84CC16" },
      parking: { label: "駐車場", color: "#14B8A6" },
      tahata:  { label: "田・畑", color: "#65A30D" },
      // NG系（反社/NG=永久ピン）
      hansha:  { label: "反社", color: "#1F2937" },
      ng:      { label: "NG",   color: "#6B7280" },
    };
    const STATUS_GROUPS = [
      { key: "building", label: "建物系", keys: ["akiya", "chikuko", "haikyo", "renpei", "shueki", "souko"] },
      { key: "land",     label: "土地系", keys: ["sarachi", "zasshu", "parking", "tahata"] },
      { key: "ng",       label: "NG系", keys: ["hansha", "ng"] },  // key="ng"は互換維持（DOM id/フィルタ）
    ];
    const EXCLUDE_STATUS = {
      ex_new: { label: "新築中", color: "#FACC15", text: "新", group: "building" },
      ex_demo: { label: "解体中", color: "#FACC15", text: "解", group: "building" },
      ex_live: { label: "居住中", color: "#FACC15", text: "居", group: "building" },
      ex_kouhogai_tate: { label: "候補外(建物)", color: "#FACC15", text: "外", group: "building" },
      ex_sale: { label: "分譲中", color: "#FACC15", text: "分", group: "land" },
      ex_fill: { label: "造成中", color: "#FACC15", text: "造", group: "land" },
      ex_parking: { label: "駐車場", color: "#FACC15", text: "P", group: "land" },
      ex_kouhogai_tochi: { label: "候補外(土地)", color: "#FACC15", text: "外", group: "land" },
    };
    const EXCLUDE_STATUS_GROUPS = [
      { label: "建物系（除外）", keys: ["ex_new", "ex_demo", "ex_live", "ex_kouhogai_tate"] },
      { label: "土地系（除外）", keys: ["ex_sale", "ex_fill", "ex_parking", "ex_kouhogai_tochi"] },
    ];
    // 未定義ステータス（旧データ等）のフォールバック色
    const FALLBACK_COLOR = "#9CA3AF";
    const EXCLUDE_COLOR = "#FACC15";
    const EXCLUDE_BORDER = "#78350F";

    function isExcludeCandidatePin(p) {
      return p?.excludeCandidate === true || (typeof p?.status === "string" && /^ex_/.test(p.status));
    }

    function statusDisplayLabel(key) {
      if (!key) return "";
      const info = EXCLUDE_STATUS[key] || STATUS[key];
      return info ? info.label : String(key);
    }

    // ===== 担当者カラー（地図ピン） =====
    // 担当者色は displayNames レジストリの order（0始まりの固定index）で決まる（index.html と同一方式）。
    // 並び順・在席に依存しないので各人の色は不変。order を持つ doc だけが色付け対象（＝調査員）。
    // order 無し/範囲外/未登録（事務員等）は STAFF_DEFAULT_COLOR。STAFF_PALETTE は両ファイル同一定義。
    const STAFF_PALETTE = ["#2563EB","#0891B2","#059669","#D97706","#7C3AED","#DB2777","#4D7C0F","#A21CAF","#B45309","#475569"];
    const STAFF_DEFAULT_COLOR = "#65A30D";
    let staffColorMap = {};
    async function buildStaffColors() {
      staffColorMap = {};
      try {
        const snap = await getDocs(collection(db, "displayNames"));
        snap.forEach(d => {
          const o = d.data().order;   // 0始まりの固定index（number型）。無ければ色対象外
          if (Number.isInteger(o) && o >= 0 && o < STAFF_PALETTE.length) {
            staffColorMap[d.id] = STAFF_PALETTE[o];   // d.id = メールアドレス
          }
        });
      } catch (e) {
        // displayNames 読取NG時は全員 STAFF_DEFAULT_COLOR にフォールバック
      }
    }
    function staffColor(email) {
      return staffColorMap[email] || STAFF_DEFAULT_COLOR;
    }

    // ===== 調査周回（round）— C-1 基盤 =====
    function areaKey(p){ return (p && p.areaCode) || null; }   // areaCode(JIS5桁)ベース。旧cityWardKey(正規表現)は不使用
    let roundState = {};      // `${branch}__${areaKey}` -> {currentRound, rounds}
    let roundsUnsub = null;   // survey_rounds 購読の解除関数（多重購読防止）
    // survey_rounds を購読。現在周回の変化で色/薄色・周回フィルタ候補が変わるため再描画。マスタ無=1。
    function listenRounds(){
      if (roundsUnsub) roundsUnsub();
      roundsUnsub = onSnapshot(collection(db, "survey_rounds"), snap => {
        roundState = {}; snap.forEach(d => roundState[d.id] = d.data());
        updateRoundFilter(); renderList(); renderAllMarkers();   // 周回色が変わる＝描画済みの見た目が変わるので全再描画
      }, e => {});
    }
    function currentRoundOf(p){ const s = roundState[`${pinBranch(p)}__${areaKey(p)}`]; return (s && Number(s.currentRound)) || 1; }
    function roundOf(p){ return Number(p.surveyRound) || 1; }
    function isPastRound(p){ return !isPermanentPin(p) && roundOf(p) < currentRoundOf(p); }   // 過去周回の通常ピン=薄色対象
    // ラベル背景色（index/admin統一）：要確認赤 ＞ 永久黒 ＞ 除外候補黄 ＞ 周回色（1青/2緑/3橙/4紫→((r-1)%4)ローテ）。担当者色は廃止。
    const ROUND_COLORS = ["#2563EB","#16A34A","#EA580C","#9333EA"];
    function roundColor(r){ return ROUND_COLORS[(((r||1)-1)%4+4)%4]; }
    function labelColor(p){
      if (isExcludeCandidatePin(p)) return EXCLUDE_COLOR;
      if (isReviewFlagged(p)) return "#EF4444";
      if (isPermanentPin(p))  return PERMANENT_COLOR;
      return roundColor(roundOf(p));
    }

    // メール→表示名マップ。displayNames コレクション（doc ID=メール, field name）を全件読む。
    // 未登録メールはメールのままフォールバック（落とさない）。手動でdoc追加すれば即反映。
    let staffNameMap = {};
    async function buildStaffNames() {
      staffNameMap = {};
      try {
        const snap = await getDocs(collection(db, "displayNames"));
        snap.forEach(d => {
          const n = d.data().name;
          if (n) staffNameMap[d.id] = n;   // d.id = メールアドレス
        });
      } catch(e) {}
    }
    function staffName(email) {
      return staffNameMap[email] || email || "–";
    }

    // ログイン管理者自身の所属店を displayNames から取得。読取NG/未設定は "名古屋" フォールバック。
    async function loadMyBranch(email) {
      myBranch = "名古屋";
      try {
        const snap = await getDoc(doc(db, "displayNames", email));
        const b = snap.exists() ? snap.data().branch : null;
        if (b && String(b).trim()) myBranch = b;
      } catch (e) { /* 読取NGは名古屋フォールバック */ }
    }
    // ピンの所属店。branch空/欠落は "名古屋" とみなす（移行期の二重防御。棚卸しでは欠落0件）。
    function pinBranch(p) {
      return (p.branch && String(p.branch).trim()) ? p.branch : "名古屋";
    }

    // グループ見出し付き <optgroup> を生成（selected 指定で現在値を選択）。
    function statusOptionsHTML(selected) {
      const groups = [
        ...STATUS_GROUPS.map(g => ({ ...g, entries: g.keys.map(k => ({ key: k, label: STATUS[k]?.label || statusDisplayLabel(k) })) })),
        ...EXCLUDE_STATUS_GROUPS.map(g => ({ ...g, entries: g.keys.map(k => ({ key: k, label: EXCLUDE_STATUS[k]?.label || statusDisplayLabel(k) })) }))
      ];
      const known = groups.map(g =>
        `<optgroup label="${g.label}">` +
        g.entries.map(entry => `<option value="${entry.key}" ${selected === entry.key ? "selected" : ""}>${entry.label}</option>`).join("") +
        `</optgroup>`
      ).join("");
      // 未定義キー（旧データ）は壊さず現状値を選択肢として先頭に残す
      const legacy = (selected && !STATUS[selected] && !EXCLUDE_STATUS[selected])
        ? `<option value="${selected}" selected>${selected}</option>` : "";
      return legacy + known;
    }

    function makeSvgUrl(color, text) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
        <path d="M16 0 C7.16 0 0 7.16 0 16 C0 28 16 40 16 40 C16 40 32 28 32 16 C32 7.16 24.84 0 16 0Z" fill="${color}"/>
        <text x="16" y="21" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="13" font-weight="bold" font-family="sans-serif">${text}</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    // ===== AUTH =====
    onAuthStateChanged(auth, async user => {
      if (user) {
        // ===== 管理者権限チェック =====
        // admins コレクション(doc ID=uid)に存在しなければ調査員とみなし、admin画面を出さず index へ誘導。
        // 判定は doc存在のみ（ドメイン判定はしない＝ルールの isAdmin と統一）。読取NG時は安全側で拒否。
        let isAdmin = false;
        try { isAdmin = (await getDoc(doc(db, "admins", user.uid))).exists(); } catch (e) { isAdmin = false; }
        isAdminUser = isAdmin;   // 周回管理UIの開示条件（既定falseなので判定失敗時は出さない＝fail-closed）
        if (!isAdmin) {
          alert("この画面は管理者専用です。調査アプリ（index）に移動します。");
          location.href = "index.html";   // セッションは維持＝indexはそのまま使える
          return;
        }
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminScreen").style.display = "grid";
        document.getElementById("userLabel").textContent = user.email;
        // 周回管理ボタンは既定 display:none。管理者確定後にのみ開示（リダイレクト失敗時の二重防御）。
        const rmBtn = document.getElementById("roundMgrBtn");
        if (rmBtn && isAdminUser) rmBtn.style.display = "";
        initStatusFilter();       // ステータスDDの選択肢を構築（1回）
        updateStatsHighlight();   // カウンター初期ハイライト（総件数=全表示）
        // 自店は initMap より前に確定させる。初期中心の拠点駅分岐は mapOptions 段階で myBranch を読むため、
        // ここが initMap の後ろだと ZMALoader のコールバックが先に走り、京都アカウントでも名古屋駅で開く。
        await loadMyBranch(user.email);   // 初期中心の拠点駅分岐＋listenPins の絞り込みに使う
        initMap();
        // 表示名・担当者色マップ（どちらも displayNames 由来）を先に構築してから購読開始
        await buildStaffNames();
        await buildStaffColors();
        listenPins();
        listenSurveyGrids();   // 調査グリッドの進捗をリアルタイム購読（表示はトグルON時のみ）
        listenRounds();        // 周回マスタを購読（現在周回で色/薄色・周回フィルタ候補を判定）
        listenKouzuMarks();    // 公図取得済みマーク（管理者専用）を購読
      } else {
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("adminScreen").style.display = "none";
      }
    });

    window.doLogin = async () => {
      const email = document.getElementById("email").value.trim();
      const pass  = document.getElementById("pass").value;
      const btn   = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = "ログイン中…";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(e) {
        showToast("メールアドレスまたはパスワードが違います", "error");
        btn.disabled = false; btn.textContent = "ログイン";
      }
    };
    window.doLogout = () => signOut(auth);

    // ===== 調査グリッド(survey grid) MVP — 表示専用 =====
    // index.html と同一定義（原点/サイズ/版）。管理画面は俯瞰のみでマスのタップ編集はしない。
    const GRID = { lat0: 35.00, lng0: 136.80, refLat: 35.2, sizeM: 250, version: "v1-250m" };
    const GRID_DLAT = GRID.sizeM / 111000;
    const GRID_DLNG = GRID.sizeM / (111000 * Math.cos(GRID.refLat * Math.PI / 180));

    function gridCellCorners(row, col) {
      const s = GRID.lat0 + row * GRID_DLAT, n = GRID.lat0 + (row + 1) * GRID_DLAT;
      const w = GRID.lng0 + col * GRID_DLNG, e = GRID.lng0 + (col + 1) * GRID_DLNG;
      return [ new ZDC.LatLng(s, w), new ZDC.LatLng(n, w), new ZDC.LatLng(n, e), new ZDC.LatLng(s, e) ];
    }

    // 調査済みマスをリアルタイム購読（現場の記録が即・管理画面に反映）。
    function listenSurveyGrids() {
      onSnapshot(collection(db, "survey_grids"), snap => {
        surveyedCells = {};
        snap.forEach(d => { surveyedCells[d.id] = d.data(); });
        if (gridMode) redrawGrid();
      });
    }

    function clearGridWidgets() {
      gridWidgets.forEach(w => { try { map.removeWidget(w); } catch (e) {} });
      gridWidgets = [];
    }

    // 可視範囲のグリッド線＋（調査済み）塗りを描画。地図移動(idle)ごとに呼ぶ。表示専用。
    function redrawGrid() {
      if (!map) return;
      clearGridWidgets();
      if (!gridMode) return;
      const b = map.getLatLngBounds();
      const sw = b.getSouthWest(), ne = b.getNorthEast();
      const rMin = Math.floor((sw.lat - GRID.lat0) / GRID_DLAT);
      const rMax = Math.floor((ne.lat - GRID.lat0) / GRID_DLAT);
      const cMin = Math.floor((sw.lng - GRID.lng0) / GRID_DLNG);
      const cMax = Math.floor((ne.lng - GRID.lng0) / GRID_DLNG);
      if ((rMax - rMin) <= 60 && (cMax - cMin) <= 60) {
        for (let r = rMin; r <= rMax + 1; r++) {
          const lat = GRID.lat0 + r * GRID_DLAT;
          const ln = new ZDC.Polyline(
            [ new ZDC.LatLng(lat, GRID.lng0 + cMin * GRID_DLNG), new ZDC.LatLng(lat, GRID.lng0 + (cMax + 1) * GRID_DLNG) ],
            { color: "#1D4ED8", width: 1, opacity: 0.25 }
          );
          map.addWidget(ln); gridWidgets.push(ln);
        }
        for (let c = cMin; c <= cMax + 1; c++) {
          const lng = GRID.lng0 + c * GRID_DLNG;
          const ln = new ZDC.Polyline(
            [ new ZDC.LatLng(GRID.lat0 + rMin * GRID_DLAT, lng), new ZDC.LatLng(GRID.lat0 + (rMax + 1) * GRID_DLAT, lng) ],
            { color: "#1D4ED8", width: 1, opacity: 0.25 }
          );
          map.addWidget(ln); gridWidgets.push(ln);
        }
      }
      Object.values(surveyedCells).forEach(cell => {
        if (cell.row == null || cell.col == null) return;
        if (cell.row < rMin - 1 || cell.row > rMax + 1 || cell.col < cMin - 1 || cell.col > cMax + 1) return;
        const fillCol = staffColor(cell.surveyedBy);   // 担当者色（null/未登録はdefaultにフォールバック）
        const poly = new ZDC.Polygon(
          gridCellCorners(cell.row, cell.col),
          { fill: fillCol, fillOpacity: 0.30, stroke: fillCol, strokeWidth: 1 }
        );
        // 色付きマス（doc存在）のみクリックで色リセット。無色マスはポリゴン自体が無い＝無反応。
        poly.addEventListener("click", () => resetGridCell(cell));
        map.addWidget(poly); gridWidgets.push(poly);
      });
    }

    // ===== グリッド色リセット（admin専用・1マス）=====
    // 色付き＝調査済みマスの survey_grids doc を削除＝色を未調査に戻す。
    // 枠は GRID から計算描画なので doc 削除でも残る。現場 index 側も onSnapshot で色が追従消去。
    // admin は塗る側ではないので「消す」専用（無色マスにはハンドラを付けていない）。
    async function resetGridCell(cell) {
      const gid = "G_" + cell.row + "_" + cell.col;   // doc ID は row/col から再構成（surveyedDoc の id と一致）
      const who = staffName(cell.surveyedBy) || "不明";
      const when = cell.surveyedDate || "日付不明";
      if (!confirm(`このマスの調査済みをリセットしますか？\n担当：${who}／調査日：${when}\n（枠は残り、色だけ未調査に戻ります）`)) return;
      try {
        await deleteDoc(doc(db, "survey_grids", gid));
        showToast("グリッドの色をリセットしました");
        // surveyedCells の更新・再描画は listenSurveyGrids の onSnapshot が担う（楽観更新は不要）
      } catch (e) {
        showToast("リセットに失敗しました（権限/通信）", "error");
      }
    }

    // グリッド進捗オーバーレイの表示ON/OFF。ボタン色で状態を明示。
    window.toggleGridMode = () => {
      gridMode = !gridMode;
      const btn = document.getElementById("gridBtn");
      if (btn) {
        btn.classList.toggle("active", gridMode);
        btn.textContent = gridMode ? "▦ グリッドON" : "▦ グリッド";
      }
      redrawGrid();
    };

    // ===== MAP =====
    function initMap() {
      if (map) return;
      ZMALoader.setOnLoad(function(mapOptions, error) {
        if (error) { console.error(error); return; }
        // 初期中心はログイン管理者の「店の所在地」。事務所での作業起点なので駅ではなく店に置く。
        // ※index.html は現場アプリなので拠点駅のまま（意図的に admin とは別基準）。
        // myBranch は onAuthStateChanged 内で initMap より前に確定済み。
        const HOME_CENTER = { "京都": new ZDC.LatLng(34.957969663952724, 135.76069814005794) };   // 京都店
        mapOptions.center = HOME_CENTER[myBranch]
          || new ZDC.LatLng(35.12665773554829, 136.92989789393815);   // 既定=名古屋店
        mapOptions.zoom = ADMIN_DEFAULT_ZOOM;   // Z18。カリング前提で「画面内の少数だけ描く」に合わせた倍率
        mapOptions.movable = true;
        mapOptions.zoomable = true;
        mapOptions.mouseOperation = true;
        mapOptions.touchOperation = true;
        // 下地を常時「標準住宅地図デザイン」に（表札＋住居表示。大縮尺=ズームインで視認）。
        // TODO: 本番キーでは契約発行の住宅地図デザインIDへ差し替え（検証環境は Ai3Y2Jwp）。
        mapOptions.zipsMapType = 'Ai3Y2Jwp';

        map = new ZDC.Map(
          document.getElementById("map"),
          mapOptions,
          function() {
            map.addControl(new ZDC.ZoomButton('top-left'));
            map.addControl(new ZDC.ScaleBar('bottom-left'));
            // 地図移動・ズーム完了(idle)でグリッドを可視範囲だけ再描画（gridMode中のみ）。
            map.addEventListener("idle", function() { if (gridMode) redrawGrid(); });
            // 番号ラベルのズーム閾値(Z16)を跨いだ時だけピンを描き直す。
            // 同一ズーム帯のパン・ズームでは labelsShown が変わらない＝再生成しない（カクつき防止）。
            map.addEventListener("idle", function(){
              if ((map.getZoom() >= LABEL_MIN_ZOOM) !== labelsShown) renderAllMarkers();
            });
            // ビューポートカリング：移動・ズーム後に可視範囲のピンだけへ差分更新する。
            // 【順序が重要】必ず上の閾値跨ぎリスナより後に登録する。跨いだ時は先に renderAllMarkers() が
            // 走って labelsShown を更新し、こちらは no-op になる。逆順だと跨ぎが検出できなくなる。
            map.addEventListener("idle", function(){ relayoutVisiblePins(); });
            // 用途地域/地番レイヤ：移動・ズーム後に再描画／用途地域ON時はクリックで属性取得
            map.addEventListener("idle", function(){ redrawActiveLayers(); });
            map.addEventListener("click", function(e){
              if (!e || !e.latlng) return;
              if (regMode) { registerFromClick(e.latlng); return; }   // 反社/NG登録モード優先
              if (kouzuMode) { openKouzuModal(e.latlng); return; }    // 公図取得モード（regModeと排他）
              if (youtoOn) queryYouto(e.latlng);
            });
            renderAllMarkers();
            renderKouzuMarks();   // 購読が地図生成より先に来ていた場合の初回描画（以降は onSnapshot 起点）
          },
          function() { console.error("地図初期化失敗"); }
        );
      });
    }

    // ===== データ重畳（用途地域 / 地番）=====
    //
    // 地番(bluemap) : ZENRIN WMS（ラスタ画像）。従来どおり。
    // 用途地域(youto): 国土交通省「不動産情報ライブラリ」XKT002（GeoJSONベクタ）。
    //                  2026-07-14 に ZENRIN WMS から移行（ZENRIN契約から用途地域を外して年約50万削減）。
    //                  取得は Cloud Functions の youto プロキシ経由（APIキーはSecret Manager）。
    //                  ※XKT002 は「用途地域名／建蔽率／容積率」のみ。防火地域・高度地区は取得できない。
    //
    // TODO: bluemap の WMS_KEY が直書きのまま。このリポジトリは Public なので、
    //       zenrin プロキシ経由に変えてキーをコードから消すこと（別タスク）。
    const WMS_KEY        = "2xYL6LK8wxaJGUxZ8rwdD9rv4sHGXXX51pD8tLUW";
    const BLUEMAP_BASE   = "https://test-web.zmaps-api.com/map/wms/bluemap";
    const BLUEMAP_LAYERS = "lp1,ll1,lc1,lw1";
    // 地番/表札が読める閾値ズーム。引いて見えない時だけここまで寄せる（密集地でも読めるよう20）
    const ZOOM_READABLE  = 20;
    let youtoOn = false, chibanOn = false;
    const layerWidgets = { bluemap:null, youto:null };
    let layerRedrawing = false, layerRedrawQueued = false;

    // ── 用途地域（不動産情報ライブラリ XKT002）──────────────────────
    const YOUTO_API   = "https://youto-ptddjpvgeq-an.a.run.app";  // Cloud Functions youto プロキシ
    const YOUTO_MAX_TILES = 24;   // 1描画で取りに行くタイル数の上限（超えるならズームを1段引く）
    const youtoTileCache = new Map();   // "z/x/y" -> features[]（パン時の再取得を防ぐ）
    let   youtoFeatures  = [];          // 現在描画中のfeature（クリック判定にそのまま使う）

    // 用途地域13分類の色（youto_id は国土数値情報の用途地域分類コードと同一体系）
    const YOUTO_COLORS = {
      "1":  "#7FBF7F",  // 第一種低層住居専用地域
      "2":  "#A8D8A8",  // 第二種低層住居専用地域
      "3":  "#C8E6A0",  // 第一種中高層住居専用地域
      "4":  "#E0F0B0",  // 第二種中高層住居専用地域
      "5":  "#F2EDA0",  // 第一種住居地域
      "6":  "#F2E080",  // 第二種住居地域
      "7":  "#F2D060",  // 準住居地域
      "8":  "#B5E6B5",  // 田園住居地域
      "9":  "#F5B0A0",  // 近隣商業地域
      "10": "#F08080",  // 商業地域
      "11": "#C0A0C0",  // 準工業地域
      "12": "#A0C0E0",  // 工業地域
      "13": "#80A0D0",  // 工業専用地域
    };
    const YOUTO_FALLBACK = "#9CA3AF";   // 未知コードは灰色（ピンの FALLBACK_COLOR と同じ思想）

    function wmsHeaders(){ return { "Content-Type":"application/x-www-form-urlencoded", "x-api-key":WMS_KEY, "Authorization":"referer" }; }
    function layerBBoxArr(){ const b=map.getLatLngBounds(); const sw=map.latlngToWebMercator(b.getSouthWest()); const ne=map.latlngToWebMercator(b.getNorthEast()); return [sw[0],sw[1],ne[0],ne[1]]; }
    function removeLayerWidget(slot){ if(layerWidgets[slot]){ try{ map.removeWidget(layerWidgets[slot]); }catch(e){} layerWidgets[slot]=null; } }

    // 地番(bluemap)のWMSラスタ重畳。用途地域は drawYoutoLayer()（GeoJSON）に分離済み。
    async function drawWmsLayer(slot){
      const conf = {base:BLUEMAP_BASE,layers:BLUEMAP_LAYERS,name:'地番'};
      const size=map.getMapSize(); const bbox=layerBBoxArr().join(",");
      const params={ VERSION:"1.3.0",REQUEST:"GetMap",LAYERS:conf.layers,CRS:"EPSG:3857",BBOX:bbox,WIDTH:size.width,HEIGHT:size.height,FORMAT:"image/png" };
      try{
        const res=await fetch(conf.base,{ method:"POST",headers:wmsHeaders(),body:new URLSearchParams(params) });
        const ct=res.headers.get("content-type")||"";
        if(res.ok && ct.indexOf("image")!==-1){
          const blob=await res.blob(); const url=(window.URL||window.webkitURL).createObjectURL(blob);
          const id=slot+"_wms_"+Date.now();
          const w=new ZDC.UserWidget(map.getLatLngBounds().getNorthWest(),{ htmlSource:'<img id="'+id+'" src="" style="pointer-events:none">', propagation:true });
          map.addWidget(w); layerWidgets[slot]=w; document.getElementById(id).src=url;
        } else {
          const body=await res.text().catch(()=> ""); showToast(conf.name+"の重畳に失敗（"+res.status+"）","error"); console.error(conf.name+" WMS",res.status,body);
        }
      }catch(e){ showToast(conf.name+"の重畳に失敗（通信/CORS）","error"); console.error(conf.name+" WMS exception",e); }
    }

    // ON中のレイヤを順序固定で再描画。多重発火はコアレス。
    // 静止中のidle連発で再描画ループ（チラつき）が起きるため、同一BBOX＋同一トグル状態で
    // 既に描画済みなら何もしない（実際の移動/トグル変更時のみ再描画）。
    let lastLayerKey = "";
    async function redrawActiveLayers(){
      if(!map) return;
      if(layerRedrawing){ layerRedrawQueued=true; return; }
      const active = (youtoOn || chibanOn);
      const key = active ? `${youtoOn?1:0}${chibanOn?1:0}:`+layerBBoxArr().map(n=>Math.round(n)).join(",") : "off";
      const widgetsOk = (!youtoOn || layerWidgets.youto) && (!chibanOn || layerWidgets.bluemap);
      if(key===lastLayerKey && widgetsOk) return;
      layerRedrawing=true;
      try{
        removeLayerWidget('youto'); removeLayerWidget('bluemap');
        if(youtoOn)  await drawYoutoLayer();
        if(chibanOn) await drawWmsLayer('bluemap');
        if(youtoOn || chibanOn){ if(gridMode) redrawGrid(); renderAllMarkers(); } // 画像の上にグリッド→ピンを戻す
        lastLayerKey = key;
      } finally {
        layerRedrawing=false;
        if(layerRedrawQueued){ layerRedrawQueued=false; redrawActiveLayers(); }
      }
    }

    // ───────────────────────────────────────────────────────────────
    // 用途地域レイヤ（不動産情報ライブラリ XKT002 / GeoJSON）
    //
    // XYZタイル方式（z=11〜15）。可視範囲を覆うタイルだけを取りに行くので、
    // 対象エリアが何府県に増えても取得量は変わらない（＝広域展開してもコストが増えない）。
    // 取得したポリゴンは canvas に描いて、WMS画像と同じ ZDC.UserWidget で重ねる。
    // ───────────────────────────────────────────────────────────────

    const lngToTileX = (lng,z) => Math.floor((lng+180)/360 * 2**z);
    const latToTileY = (lat,z) => {
      const r = lat*Math.PI/180;
      return Math.floor((1 - Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2 * 2**z);
    };

    // 可視範囲を YOUTO_MAX_TILES 枚以内で覆える最大の（＝最も詳細な）ズームを選ぶ。
    // z=11でも覆えない＝引きすぎ、の場合は -1（描画しない）。
    function pickYoutoZoom(){
      const b=map.getLatLngBounds(), sw=b.getSouthWest(), ne=b.getNorthEast();
      for(let z=15; z>=11; z--){
        const nx = lngToTileX(ne.lng,z) - lngToTileX(sw.lng,z) + 1;
        const ny = latToTileY(sw.lat,z) - latToTileY(ne.lat,z) + 1;
        if(nx*ny <= YOUTO_MAX_TILES) return z;
      }
      return -1;
    }

    async function fetchYoutoTile(z,x,y){
      const key = `${z}/${x}/${y}`;
      if(youtoTileCache.has(key)) return youtoTileCache.get(key);
      const token = await auth.currentUser.getIdToken();
      const res = await fetch(`${YOUTO_API}?z=${z}&x=${x}&y=${y}`, { headers:{ Authorization:`Bearer ${token}` } });
      if(!res.ok) throw new Error(`youto ${res.status} (${key})`);
      const gj = await res.json();
      const feats = gj.features || [];
      youtoTileCache.set(key, feats);
      return feats;
    }

    async function drawYoutoLayer(){
      const z = pickYoutoZoom();
      if(z < 0){ showToast("用途地域：範囲が広すぎます。ズームインしてください","warn"); youtoFeatures=[]; return; }

      const b=map.getLatLngBounds(), sw=b.getSouthWest(), ne=b.getNorthEast();
      const x0=lngToTileX(sw.lng,z), x1=lngToTileX(ne.lng,z);
      const y0=latToTileY(ne.lat,z), y1=latToTileY(sw.lat,z);

      let feats=[];
      try{
        const jobs=[];
        for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) jobs.push(fetchYoutoTile(z,x,y));
        (await Promise.all(jobs)).forEach(fs => { feats = feats.concat(fs); });
      }catch(e){
        showToast("用途地域の取得に失敗しました","error"); console.error("youto fetch", e);
        youtoFeatures=[]; return;
      }
      youtoFeatures = feats;   // クリック判定はこの配列に対してローカルで行う（サーバ往復ゼロ）
      if(!feats.length) return;

      // ── canvas に描画（座標系は WMS と同じ EPSG:3857。BBOX/投影とも map の関数に揃える）──
      const size = map.getMapSize();
      const [minx,miny,maxx,maxy] = layerBBoxArr();
      const cv = document.createElement("canvas");
      cv.width = size.width; cv.height = size.height;
      const ctx = cv.getContext("2d");

      const toPx = (lng,lat) => {
        const p = map.latlngToWebMercator(new ZDC.LatLng(lat,lng));
        return [ (p[0]-minx)/(maxx-minx)*size.width, (maxy-p[1])/(maxy-miny)*size.height ];
      };
      const pathRing = (ring) => {
        for(let i=0;i<ring.length;i++){
          const [px,py] = toPx(ring[i][0], ring[i][1]);
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
      };

      ctx.lineWidth = 1;
      for(const f of feats){
        const g = f.geometry; if(!g) continue;
        const color = YOUTO_COLORS[String(f.properties?.youto_id)] || YOUTO_FALLBACK;
        const polys = (g.type === "Polygon") ? [g.coordinates] : (g.type === "MultiPolygon" ? g.coordinates : []);
        if(!polys.length) continue;
        ctx.beginPath();
        for(const poly of polys) for(const ring of poly) pathRing(ring);   // ring[0]=外周 / ring[1..]=穴
        ctx.globalAlpha = 0.45; ctx.fillStyle = color; ctx.fill("evenodd");
        ctx.globalAlpha = 0.95; ctx.strokeStyle = color; ctx.stroke();
      }
      ctx.globalAlpha = 1;

      const id = "youto_gj_" + Date.now();
      const w = new ZDC.UserWidget(map.getLatLngBounds().getNorthWest(), {
        htmlSource: '<img id="'+id+'" src="" style="pointer-events:none">', propagation:true
      });
      map.addWidget(w); layerWidgets.youto = w;
      document.getElementById(id).src = cv.toDataURL("image/png");
    }

    // ── クリック地点の用途地域（point-in-polygon をローカル判定。API往復なし）──
    function pointInRing(lng,lat,ring){
      let inside=false;
      for(let i=0,j=ring.length-1; i<ring.length; j=i++){
        const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
        if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
      }
      return inside;
    }
    function pointInPolygon(lng,lat,poly){
      if(!pointInRing(lng,lat,poly[0])) return false;          // 外周の外なら即false
      for(let k=1;k<poly.length;k++) if(pointInRing(lng,lat,poly[k])) return false;  // 穴の中はfalse
      return true;
    }
    function findYoutoAt(lng,lat){
      for(const f of youtoFeatures){
        const g=f.geometry; if(!g) continue;
        const polys = (g.type==="Polygon") ? [g.coordinates] : (g.type==="MultiPolygon" ? g.coordinates : []);
        for(const poly of polys) if(pointInPolygon(lng,lat,poly)) return f.properties;
      }
      return null;
    }

    function queryYouto(latlng){
      const box = document.getElementById("youtoInfo");
      if(!box) return;
      const close = '<span class="yi-close" onclick="closeYoutoInfo()">✕</span>';
      const p = findYoutoAt(latlng.lng, latlng.lat);
      if(!p){
        box.innerHTML = close + 'この地点に用途地域データなし（区域外／市街化調整区域の可能性）';
        box.style.display = "block"; return;
      }
      box.innerHTML = close
        + '<b>用途地域</b>：' + (p.use_area_ja || '-') + '<br>'
        + '建ぺい率：' + (p.u_building_coverage_ratio_ja || '-') + ' ／ 容積率：' + (p.u_floor_area_ratio_ja || '-') + '<br>'
        + '<span style="opacity:.65;font-size:11px">' + (p.city_name || '') + '　出典：国土交通省 不動産情報ライブラリ</span>';
      box.style.display = "block";
    }

    window.closeYoutoInfo = () => { const b=document.getElementById("youtoInfo"); if(b) b.style.display="none"; };
    window.toggleYouto    = () => { youtoOn=!youtoOn; const btn=document.getElementById("youtoBtn"); if(btn) btn.classList.toggle("active",youtoOn); if(!youtoOn) closeYoutoInfo(); redrawActiveLayers(); };
    window.toggleChiban   = () => { chibanOn=!chibanOn; const btn=document.getElementById("chibanBtn"); if(btn) btn.classList.toggle("active",chibanOn); redrawActiveLayers(); };
    // 公図マークの表示ON/OFF（既定OFF）。レイヤ重畳ではないので redrawActiveLayers は呼ばない。
    window.toggleKouzu    = () => {
      kouzuOn = !kouzuOn;
      const btn = document.getElementById("kouzuBtn"); if (btn) btn.classList.toggle("active", kouzuOn);
      if (!kouzuOn) closeKouzuInfo();
      renderKouzuMarks();
    };

    // ===== REALTIME LISTEN =====
    function listenPins() {
      const q = query(collection(db, "pins"), orderBy("createdAt", "desc"));
      onSnapshot(q, snap => {
        // 自店フィルタ：allPins段階で自店ピンだけに絞る（stats/ドロップダウン/地図/Excel が全て自店スコープになる）。
        allPins = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(p => pinBranch(p) === myBranch);
        updateStats();
        updateStaffFilter();
        updateDateFilter();
        updateAreaFilter();
        updateRoundFilter();
        renderList();
        renderAllMarkers();   // ピンデータ更新＝色/ラベルが変わり得るので全再描画
      });
    }

    // ===== 公図取得済みマーク：購読・描画・ポップアップ・削除（管理画面専用）=====
    // マークの所属店。branch空/欠落は "名古屋" とみなす（pinBranch と同じ二重防御）。
    function kouzuBranch(m) { return (m.branch && String(m.branch).trim()) ? m.branch : "名古屋"; }

    // rules 未deploy時は read が既定denyで例外になる。errorコールバックで握りつぶし、
    // pins/グリッド等の既存機能を巻き込んで壊さない（コード反映とrules反映は別便のため必須）。
    function listenKouzuMarks() {
      onSnapshot(collection(db, "kouzu_marks"),
        snap => {
          kouzuMarks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(m => kouzuBranch(m) === myBranch);   // pins と同じ自店スコープ
          renderKouzuMarks();
        },
        err => { console.warn("kouzu_marks 購読不可（rules未反映の可能性）", err); }
      );
    }

    // pinWidgetMap とは別に管理。ピンの再描画（renderAllMarkers/relayoutVisiblePins）と互いに消し合わない。
    function renderKouzuMarks() {
      if (!map) return;
      kouzuWidgets.forEach(w => { try { map.removeWidget(w); } catch(e){} });
      kouzuWidgets = [];
      if (!kouzuOn) return;
      kouzuMarks.forEach(m => {
        if (typeof m.lat !== "number" || typeof m.lng !== "number") return;   // 壊れdocで落ちない
        const mk = new ZDC.Marker(new ZDC.LatLng(m.lat, m.lng), { color: KOUZU_COLOR, text: "公" });
        mk.addEventListener("click", function() { showKouzuInfo(m.id); });
        map.addWidget(mk);
        kouzuWidgets.push(mk);

        // 判別＋クリック確実化用のチップ。既存ピンとマーカーが重なると本体を掴めず削除できないため、
        // 「見えているチップ自体」をクリック対象にする（pointer-events:auto）。
        // seqLabel(#001) と同じ UserWidget・同じ offset。propagation:false と stopPropagation で
        // クリックを地図へ抜けさせない（公図取得モードON中に登録モーダルが開くのを防ぐ）。
        // m.id は Firestore 自動ID（英数）なのでシングルクオート内に直接埋めて安全。
        const chip = new ZDC.UserWidget(
          new ZDC.LatLng(m.lat, m.lng),
          {
            htmlSource:
              '<div onclick="event.stopPropagation();showKouzuInfo(\'' + m.id + '\')"'
              + ' style="transform:translateX(-50%);white-space:nowrap;'
              + 'padding:2px 9px;border-radius:9px;'
              // チップはマーカー(シアン)と別色のオレンジ。青ピン群に埋もれないための視認色で、
              // 他社#CA8A04 / 要確認#EF4444 / 反社#1F2937 のいずれとも被らない。
              + 'background:#EA580C;color:#fff;'
              + 'font-size:12px;font-weight:800;line-height:1.6;'
              + 'border:1px solid #fff;'
              + 'box-shadow:0 1px 3px rgba(0,0,0,.35);'
              + 'pointer-events:auto;cursor:pointer;">📄公図</div>',
            offset: new ZDC.Point(0, -58),
            propagation: false,
          }
        );
        map.addWidget(chip);
        kouzuWidgets.push(chip);   // トグルOFF/削除時にマーカーと一緒に removeWidget される
      });
    }

    // serverTimestamp は書込直後（ローカル反映）では null。サーバ確定までは「保存中…」を出す。
    function kouzuDateText(m) {
      const d = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
      if (!d) return "保存中…";
      return new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo",
        year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    }
    // 取得者名は displayNames（staffNameMap）で解決。未登録はメールのローカル部にフォールバック。
    function kouzuWho(email) {
      const e = email || "";
      return staffNameMap[e] || (e.includes("@") ? e.split("@")[0] : e) || "–";
    }

    function showKouzuInfo(id) {
      const box = document.getElementById("kouzuInfo");
      const m = kouzuMarks.find(x => x.id === id);
      if (!box || !m) return;
      box.innerHTML =
        '<span class="ki-close" onclick="closeKouzuInfo()">✕</span>'
        + '<b>📄 公図 取得済み</b><br>'
        + '対象：' + escAttr(m.targetChiban || "（未記入）") + '<br>'
        + (m.note ? 'メモ：' + escAttr(m.note) + '<br>' : '')
        + '取得日：' + kouzuDateText(m) + '<br>'
        + '取得者：' + escAttr(kouzuWho(m.createdBy)) + '<br>'
        + '<button class="ki-del" onclick="deleteKouzuMark(\'' + m.id + '\')">🗑 このマークを削除</button>';
      box.style.display = "block";
    }
    window.closeKouzuInfo = () => { const b = document.getElementById("kouzuInfo"); if (b) b.style.display = "none"; };
    // 📄公図チップのインライン onclick から呼ぶため window に出す（module スコープのままだと
    // インラインhandler=グローバル評価で ReferenceError になり、チップが反応しない）。
    window.showKouzuInfo = showKouzuInfo;

    // 削除は管理者のみ（rules でも担保）。楽観更新＝先にローカルから外して再描画し、
    // 失敗時はロールバック（index.html の deletePin と同思想）。
    window.deleteKouzuMark = async (id) => {
      if (!confirm("この公図取得済みマークを削除しますか？")) return;
      const before = kouzuMarks;
      kouzuMarks = kouzuMarks.filter(m => m.id !== id);
      renderKouzuMarks();
      closeKouzuInfo();
      try {
        await deleteDoc(doc(db, "kouzu_marks", id));
        showToast("公図マークを削除しました");
      } catch(e) {
        kouzuMarks = before; renderKouzuMarks();
        showToast("削除に失敗しました（権限/通信）", "error");
      }
    };

    // ===== STATS =====
    function updateStats() {
      const counts = {};
      Object.keys(STATUS).forEach(k => counts[k] = 0);
      allPins.forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
      document.getElementById("stat-total").textContent = allPins.length;
      // グループ小計（建物系・土地系・NG系）。カードが存在すれば反映。
      STATUS_GROUPS.forEach(g => {
        const sub = g.keys.reduce((n, k) => n + counts[k], 0);
        const el = document.getElementById("stat-group-" + g.key);
        if (el) el.textContent = sub;
      });
    }

    // ===== STAFF FILTER =====
    // 担当者リストは「現在の日付フィルタに出勤した人」だけに絞る（日付↔担当者の双方向連動）。
    // 構成基準は activeDateFilter のみ（自分=担当者では絞らない）＝ updateDateFilter と非再帰で対称。
    // 無限ループ防止：update系は互いを呼ばない。set系ハンドラだけが両update系を呼ぶ。
    function updateStaffFilter() {
      const base = allPins.filter(p => activeDateFilter === "all" || jstYmd(p.createdAt) === activeDateFilter);
      const emails = [...new Set(base.map(p => p.email).filter(Boolean))].sort();
      // 現在の担当者が新候補に無ければ「すべて」に戻す（無効な担当者を選んだままの0件破綻を防止）。
      if (activeStaffFilter !== "all" && !emails.includes(activeStaffFilter)) activeStaffFilter = "all";
      const sel = document.getElementById("staffFilter");
      sel.innerHTML = `<option value="all">担当者：すべて</option>` +
        emails.map(e => `<option value="${e}" ${e===activeStaffFilter?"selected":""}>${staffName(e)}</option>`).join("");
    }

    window.setStaffFilter = (val) => {
      activeStaffFilter = val;
      updateDateFilter();    // 担当者→日付リストを連動（無効日付は「すべて」にリセット）
      updateStaffFilter();   // 日付がリセットされ得るので担当者リスト/選択も整え直す
      renderList();
      relayoutVisiblePins();
    };

    // createdAt(ISO/UTC) を JST(+9h) の YYYY-MM-DD に。表示・フィルタ・Excelで共通利用（UTCずれ防止）。
    function jstYmd(iso) {
      const t = Date.parse(iso || "");
      if (Number.isNaN(t)) return "";
      return new Date(t + 9 * 3600 * 1000).toISOString().slice(0, 10);
    }

    // ===== DATE FILTER =====
    function updateDateFilter() {
      // 現在の担当者フィルタで絞ったピン集合から、JST日付のユニーク一覧を作る（status/dateは除外＝循環回避）。
      const base = allPins.filter(p => activeStaffFilter === "all" || p.email === activeStaffFilter);
      const dates = [...new Set(base.map(p => jstYmd(p.createdAt)).filter(Boolean))].sort().reverse();
      // 現在選択中の日付が新候補に無ければ「すべて」に戻す（無い日付を選んだままの0件破綻を防止）。
      if (activeDateFilter !== "all" && !dates.includes(activeDateFilter)) activeDateFilter = "all";
      const sel = document.getElementById("dateFilter");
      sel.innerHTML = `<option value="all">日付：すべて</option>` +
        dates.map(d => `<option value="${d}" ${d===activeDateFilter?"selected":""}>${d}</option>`).join("");
    }

    window.setDateFilter = (val) => {
      activeDateFilter = val;
      updateStaffFilter();   // 日付→担当者リストを連動（その日の出勤者だけ＋無効担当者はリセット）
      updateDateFilter();    // 担当者がリセットされ得るので日付リスト/選択も整え直す
      renderList();
      relayoutVisiblePins();
    };

    // ===== 要調査フィルタ =====
    // ON → needsReviewNow(p)（赤＝住所不明 or 地番未取得）だけ表示／OFF → 全件。
    // 日付・担当者・検索と filtered() 内で AND 結合。地図ピンも filtered() 経由で連動。
    window.setReviewOnly = (on) => {
      reviewOnly = !!on;
      renderList();
      relayoutVisiblePins();
    };

    // 総件数クリック → グループ絞りを解除して全グループ表示（＋要調査トグルもOFFへ）。
    // DD/担当者/日付/検索は独立ANDなので触らない（各自の「すべて」で解除）。
    window.showAll = () => {
      activeGroupFilter = "all";
      reviewOnly = false;
      const cb = document.getElementById("reviewOnlyToggle");
      if (cb) cb.checked = false;
      updateStatsHighlight();
      renderList();
      relayoutVisiblePins();
    };

    // グループ絞り（カウンターのショートカット）。同じグループ再クリックで解除＝全表示へ。
    window.setGroupFilter = (groupKey) => {
      activeGroupFilter = (activeGroupFilter === groupKey) ? "all" : groupKey;
      updateStatsHighlight();
      renderList();
      relayoutVisiblePins();
    };

    // ステータスDD（個別分類）。カウンターとは独立し filtered() 内でANDに合流。
    window.setStatusFilter = (val) => {
      activeStatusFilter = val;
      renderList();
      relayoutVisiblePins();
    };

    // 他社物件フィルタ（すべて/除外/だけ）。DM運用で他社物件を除外した状態別リストを出す用途。
    // 既存フィルタと filtered() 内でANDに合流。
    window.setOtherCompanyFilter = (val) => {
      otherCompanyFilter = val;
      renderList();
      relayoutVisiblePins();
    };

    // ===== エリア/周回フィルタ（C-1）=====
    // エリア＝自branchピンの areaKey 一覧を自動生成。周回＝1..最大周回。どちらも filtered() でAND合流。
    // エリアDD＝pins.areaCode でグルーピング、表示は areaName（政令市は「名古屋市東区」形式）。
    // 旧cityWardKey(正規表現)グルーピングは廃止。areaCode無し(=未判定)は末尾に
    // 「エリア未判定（N件）」として別枠表示し、選ぶと未判定ピンだけに絞れる（住所修正の潰し込み導線）。
    const AREA_NONE = "__none__";
    function updateAreaFilter(){
      const nameByCode = {};   // areaCode -> areaName（表示名）
      let noneCount = 0;
      allPins.forEach(p => {
        const c = p.areaCode;
        if (c) nameByCode[c] = p.areaName || c;
        else noneCount++;
      });
      const codes = Object.keys(nameByCode).sort((a,b) => nameByCode[a].localeCompare(nameByCode[b], "ja"));
      const valid = codes.concat(noneCount ? [AREA_NONE] : []);
      if (activeAreaFilter !== "all" && !valid.includes(activeAreaFilter)) activeAreaFilter = "all";
      const sel = document.getElementById("areaFilter");
      if (!sel) return;
      let html = `<option value="all">エリア：すべて</option>` +
        codes.map(c => `<option value="${c}" ${c===activeAreaFilter?"selected":""}>${nameByCode[c]}</option>`).join("");
      if (noneCount) html += `<option value="${AREA_NONE}" ${AREA_NONE===activeAreaFilter?"selected":""}>エリア未判定（${noneCount}件）</option>`;
      sel.innerHTML = html;
    }
    function updateRoundFilter(){
      // 周回番号の最大＝マスタ currentRound と ピン surveyRound の最大（マスタ未作成でもピンから拾う）
      let maxR = 1;
      Object.values(roundState).forEach(s => { const r = Number(s.currentRound)||1; if (r>maxR) maxR=r; });
      allPins.forEach(p => { const r = roundOf(p); if (r>maxR) maxR=r; });
      if (activeRoundFilter !== "all" && Number(activeRoundFilter) > maxR) activeRoundFilter = "all";
      const sel = document.getElementById("roundFilter");
      if (!sel) return;
      let opts = `<option value="all">周回：すべて</option>`;
      for (let r=1; r<=maxR; r++) opts += `<option value="${r}" ${String(r)===activeRoundFilter?"selected":""}>第${r}周</option>`;
      sel.innerHTML = opts;
    }
    window.setAreaFilter  = (val) => { activeAreaFilter = val; renderList(); relayoutVisiblePins(); };
    window.setRoundFilter = (val) => { activeRoundFilter = val; renderList(); relayoutVisiblePins(); };

    // ===== 周回管理（C-2）— 新しい周回を開始 =====
    // エリア（自店×市区町村）単位で currentRound を +1 する。ピン削除は一切しない。
    // 旧周回ピンの薄色化は isPastRound の副作用で自動（surveyRound は書き換えない）。
    // 破壊寄りなのは otherCompany の一括解除のみ＝可逆（個別トグルで再設定できる）。
    let roundExecBusy = false;      // 二重実行防止
    let roundPendingPlan = null;    // dry-run の結果。［実行する］はこれを消費する

    // 対象ピン＝自店 かつ 選択エリア。areaCode=null は areaKey(p)===null で絶対に一致しない（巻き込み防止）。
    function roundTargetPins(areaCode) {
      if (!areaCode) return [];
      return allPins.filter(p => pinBranch(p) === myBranch && areaKey(p) === areaCode);
    }
    function roundCurrentOf(areaCode) {
      const s = roundState[`${myBranch}__${areaCode}`];
      return (s && Number(s.currentRound)) || 1;
    }
    // エリアDD：自店ピンが存在する areaCode を areaName で列挙。未判定(null)は選択肢に出さず件数だけ別枠表示。
    window.openRoundManager = () => {
      if (!isAdminUser) return;   // fail-closed（rules 側でも write=isAdmin で二重に守られる）
      const nameByCode = {}; let noneCount = 0;
      allPins.forEach(p => {
        const c = areaKey(p);
        if (c) nameByCode[c] = p.areaName || c;
        else noneCount++;
      });
      const codes = Object.keys(nameByCode).sort((a,b) => nameByCode[a].localeCompare(nameByCode[b], "ja"));
      const sel = document.getElementById("roundAreaSel");
      sel.innerHTML = codes.length
        ? codes.map(c => `<option value="${c}">${escAttr(nameByCode[c])}</option>`).join("")
        : `<option value="">（対象エリアがありません）</option>`;
      document.getElementById("roundNoneNote").textContent =
        noneCount ? `エリア未判定 ${noneCount}件（今回の対象外）` : "";
      document.getElementById("roundYear").value = new Date().getFullYear();
      roundPendingPlan = null;
      document.getElementById("roundPreview").style.display = "none";
      document.getElementById("roundModal").style.display = "flex";
      onRoundAreaChange();
    };
    window.closeRoundManager = () => {
      roundPendingPlan = null;
      document.getElementById("roundModal").style.display = "none";
    };
    // エリアを変えたら現周回と開始ボタンの文言を更新し、出しっぱなしのプレビューは破棄する。
    window.onRoundAreaChange = () => {
      const areaCode = document.getElementById("roundAreaSel").value;
      const cur = roundCurrentOf(areaCode);
      document.getElementById("roundCurLabel").textContent = `現在：第${cur}周`;
      document.getElementById("roundStartBtn").textContent = `第${cur + 1}周を開始`;
      document.getElementById("roundStartBtn").disabled = !areaCode;
      roundPendingPlan = null;
      document.getElementById("roundPreview").style.display = "none";
    };
    // dry-run：DBへの書き込みはゼロ。購読済み allPins だけで件数を数える。
    window.previewRoundStart = () => {
      const areaCode = document.getElementById("roundAreaSel").value;
      if (!areaCode) return;
      const year = Number(document.getElementById("roundYear").value);
      if (!Number.isInteger(year) || year < 2000 || year > 2100) { showToast("年の入力が不正です", "error"); return; }
      const cur = roundCurrentOf(areaCode), next = cur + 1;
      const targets = roundTargetPins(areaCode);
      const areaName = (targets[0] && targets[0].areaName) || areaCode;
      // 薄色化＝現周回以下の非永久ピン（次周回から見て過去になる分）。
      const fade   = targets.filter(p => !isPermanentPin(p) && roundOf(p) <= cur);
      // 他社解除＝otherCompany===true の非永久ピン（NG系は据え置き＝触らない）。
      const ocOff  = targets.filter(p => !isPermanentPin(p) && p.otherCompany === true);
      const keepNg = targets.filter(p => isPermanentPin(p));
      roundPendingPlan = { areaCode, areaName, next, year, ocIds: ocOff.map(p => p.id) };
      document.getElementById("roundPreviewBody").innerHTML = `
        <div class="round-pv-title">【${escAttr(areaName)}を第${next}周にします】</div>
        <div class="round-pv-row"><span>薄色化する第${cur}周以下の非永久ピン</span><b>${fade.length}件</b></div>
        <div class="round-pv-row"><span>他社物件フラグを解除（true→false）</span><b>${ocOff.length}件</b></div>
        <div class="round-pv-row"><span>据え置き（NG系 反社/NG）</span><b>${keepNg.length}件</b></div>
        <div class="round-pv-row"><span>削除されるピン</span><b>0件</b></div>
        <div class="round-pv-note">※ピンは1件も削除しません。surveyRound も書き換えません（薄色化は自動判定）。</div>`;
      document.getElementById("roundPreview").style.display = "block";
    };
    // 本実行。［実行する］押下時のみ。順序は「pins → survey_rounds」。
    // 途中失敗しても周回が進まない＝再実行で同じ dry-run に戻れる（周回の二重進行を防ぐ）。
    window.execRoundStart = async () => {
      if (roundExecBusy || !roundPendingPlan) return;
      if (!isAdminUser) { showToast("権限がありません", "error"); return; }
      const plan = roundPendingPlan;
      const btn = document.getElementById("roundExecBtn");
      roundExecBusy = true; btn.disabled = true; btn.textContent = "実行中…";
      try {
        // ① otherCompany 一括解除。batch上限500に対し400刻みで分割。
        for (let i = 0; i < plan.ocIds.length; i += 400) {
          const batch = writeBatch(db);
          plan.ocIds.slice(i, i + 400).forEach(id => batch.update(doc(db, "pins", id), { otherCompany: false }));
          await batch.commit();
        }
        // ② 周回を進める。merge で既存 rounds を保ちつつ arrayUnion で履歴を追記。
        //    startedAt は ISO文字列（配列の内側では serverTimestamp を使えないため。pins.createdAt と同形式）。
        await setDoc(doc(db, "survey_rounds", `${myBranch}__${plan.areaCode}`), {
          branch: myBranch,
          areaKey: plan.areaCode,
          currentRound: plan.next,
          rounds: arrayUnion({
            round: plan.next,
            label: `第${plan.next}周`,
            year: plan.year,
            startedAt: new Date().toISOString(),
          }),
        }, { merge: true });
        showToast(`${plan.areaName} を第${plan.next}周にしました（他社解除 ${plan.ocIds.length}件）`);
        closeRoundManager();
        // 周回DD・薄色・一覧/地図の更新は survey_rounds と pins の onSnapshot が担う（楽観更新は不要）
      } catch (e) {
        showToast("実行に失敗しました（権限/通信）。もう一度お試しください", "error");
        console.error("execRoundStart", e);
      } finally {
        roundExecBusy = false; btn.disabled = false; btn.textContent = "実行する";
      }
    };

    // カウンターのハイライト。activeGroupFilter に対応する1枚だけ .active。
    // 総件数は「グループ絞りなし(all)」時にハイライト＝現在“全グループ表示”を示す。
    function updateStatsHighlight() {
      ["all", "building", "land", "ng"].forEach(k => {
        const el = document.getElementById("stat-item-" + k);
        if (el) el.classList.toggle("active", activeGroupFilter === k);
      });
    }

    // ステータスDDの選択肢を STATUS_GROUPS から生成（見出し=optgroupは選択不可）。1回だけ構築。
    function initStatusFilter() {
      const sel = document.getElementById("statusFilter");
      if (!sel) return;
      const groups = [
        ...STATUS_GROUPS.map(g => ({ ...g, entries: g.keys.map(k => ({ key: k, label: STATUS[k]?.label || statusDisplayLabel(k) })) })),
        ...EXCLUDE_STATUS_GROUPS.map(g => ({ ...g, entries: g.keys.map(k => ({ key: k, label: EXCLUDE_STATUS[k]?.label || statusDisplayLabel(k) })) }))
      ];
      sel.innerHTML = `<option value="all">ステータス：すべて</option>` +
        groups.map(g =>
          `<optgroup label="${g.label}">` +
          g.entries.map(entry => `<option value="${entry.key}">${entry.label}</option>`).join("") +
          `</optgroup>`
        ).join("");
    }

    // 検索ヒット判定：タグNo(#1444/1444)・住所・地番を1文字列に連結して部分一致。
    // "#1444" でも "1444" でも同じ干し草に含まれるので両方ヒットする。
    function matchesSearch(p, q) {
      if (!q) return true;
      const seq = p.seqNo != null ? fmtSeq(p.seqNo) : "";           // "#1444"
      const seqRaw = p.seqNo != null ? String(p.seqNo) : "";        // "1444"
      const hay = [seq, seqRaw, p.address || "", p.chiban || ""].join(" ").toLowerCase();
      return hay.includes(q);
    }

    // カウンター(グループ)とDD(個別)を一本化した status 判定。判定元は STATUS_GROUPS のみ（二重定義しない）。
    // カウンター＝「そのグループの全分類を一括選択」/ DD＝単一分類。両者はANDで併用。
    // 矛盾組合せ(建物系×反社)は積集合が空→0件で正しく空表示。
    function statusAllowed(p) {
      if (activeGroupFilter !== "all") {
        const allowedKeys = activeGroupFilter === "building"
          ? [...(STATUS_GROUPS.find(x => x.key === "building")?.keys || []), ...(EXCLUDE_STATUS_GROUPS[0]?.keys || [])]
          : activeGroupFilter === "land"
            ? [...(STATUS_GROUPS.find(x => x.key === "land")?.keys || []), ...(EXCLUDE_STATUS_GROUPS[1]?.keys || [])]
            : (STATUS_GROUPS.find(x => x.key === activeGroupFilter)?.keys || []);
        if (!allowedKeys.includes(p.status)) return false;
      }
      if (activeStatusFilter !== "all" && p.status !== activeStatusFilter) return false;
      return true;
    }

    function filtered() {
      const q = searchQuery.trim().toLowerCase();
      return allPins.filter(p => {
        const reviewOk = !reviewOnly || isReviewFlagged(p);   // 要調査のみON時は赤ラベルだけ
        const staffOk  = activeStaffFilter  === "all" || p.email === activeStaffFilter;
        const dateOk   = activeDateFilter   === "all" || jstYmd(p.createdAt) === activeDateFilter;
        const searchOk = matchesSearch(p, q);   // 既存フィルタの最後に重ねがけ（AND）
        const statusOk = statusAllowed(p);       // カウンター(グループ)＋DD(個別)をANDで併用
        const oc = p.otherCompany === true;
        const ocOk = otherCompanyFilter === "all" || (otherCompanyFilter === "exclude" ? !oc : oc);
        const areaOk  = activeAreaFilter === "all"
                      || (activeAreaFilter === AREA_NONE ? !p.areaCode : p.areaCode === activeAreaFilter);
        // 周回絞り：NG系(永久ピン)は周回に無関係で常時通過。それ以外は指定周回に一致するもののみ。
        const roundOk = isPermanentPin(p) || activeRoundFilter === "all" || roundOf(p) === Number(activeRoundFilter);
        return reviewOk && staffOk && dateOk && searchOk && statusOk && ocOk && areaOk && roundOk;
      });
    }

    // ===== 操作対象の共通判定（チェック基点）=====
    // Excel出力・出力取消が共有する。チェックが1件以上→チェックした案件、0件→表示中(filtered)全体。
    // ※削除だけはこの「0件→全件」を使わない（誤爆防止のためチェック必須・bulkDelete参照）。
    function selectionTargets() {
      return checkedIds.size > 0
        ? allPins.filter(p => checkedIds.has(p.id))
        : filtered();
    }

    // ===== SEARCH（インクリメンタル）=====
    window.setSearch = (val) => {
      searchQuery = val;
      const clr = document.getElementById("searchClear");
      if (clr) clr.style.display = val ? "block" : "none";
      renderList();
      relayoutVisiblePins();   // 地図ピンもリストと同じ表示集合に揃える
    };
    window.clearSearch = () => {
      searchQuery = "";
      const inp = document.getElementById("searchInput");
      if (inp) inp.value = "";
      const clr = document.getElementById("searchClear");
      if (clr) clr.style.display = "none";
      renderList();
      relayoutVisiblePins();
    };

    // ===== LIST =====
    // 固定連番の表示用フォーマット：3桁ゼロ埋め(#001)。1000件超は自然に4桁へ拡張。
    function fmtSeq(n) {
      return n != null ? "#" + String(n).padStart(3, "0") : "";
    }

    function renderList() {
      const pins = filtered();
      filteredPins = pins;   // 地図描画側のキャッシュを同時に更新（relayoutVisiblePins がこれを読む）
      const container = document.getElementById("pinList");
      const hasChecked = checkedIds.size > 0;

      document.getElementById("bulkDeleteBtn").style.display = hasChecked ? "flex" : "none";
      document.getElementById("bulkDeleteBtn").textContent = `🗑 ${checkedIds.size}件削除`;

      // 全選択チェックボックスの状態を「現在表示中のピン」基準で同期
      const selCb = document.getElementById("selectAllCheck");
      if (selCb) {
        const allChecked = pins.length > 0 && pins.every(p => checkedIds.has(p.id));
        selCb.checked = allChecked;
        selCb.indeterminate = !allChecked && pins.some(p => checkedIds.has(p.id));
      }
      const selCnt = document.getElementById("selectCount");
      if (selCnt) selCnt.textContent = checkedIds.size ? `${checkedIds.size}件選択中` : "";

      if (pins.length === 0) {
        container.innerHTML = `<div class="empty">該当するピンがありません</div>`;
        return;
      }
      container.innerHTML = pins.map(p => {
        // 未定義ステータスでも崩れないようガード
        const s = STATUS[p.status] || EXCLUDE_STATUS[p.status];
        const isExclude = isExcludeCandidatePin(p);
        const sLabel = isExclude
          ? (EXCLUDE_STATUS[p.status] ? `除外候補：${EXCLUDE_STATUS[p.status].label}` : "除外候補")
          : (s ? s.label : (p.status || "不明"));
        // 要確認（住所不明 or 地番未取得）はバッジを赤にして示す。色基準は needsReviewNow に統一。
        const review = isReviewFlagged(p);
        const sColor = isExclude ? EXCLUDE_COLOR : (review ? "#EF4444" : (isPermanentPin(p) ? PERMANENT_COLOR : (s ? s.color : FALLBACK_COLOR)));
        const sTextColor = isExclude ? "#111827" : "#fff";
        const date = jstYmd(p.createdAt) || "–";
        const isChecked = checkedIds.has(p.id);
        const isSelected = selectedPinId === p.id;
        // Excel出力済み（exportedAt あり）はグレーアウト＋出力済行で未出力と区別。
        // 「拾った情報(発見日/担当者)」と「出力した情報」を分けるためカード末尾に独立行で出す。
        const exported = !!p.exportedAt;
        const exportedByName = p.exportedBy ? staffName(p.exportedBy) : "";
        const exportedMD = p.exportedAt
          ? `${Number(p.exportedAt.slice(5,7))}/${Number(p.exportedAt.slice(8,10))}` : "";
        // Googleマップの通常マップ表示で開く。座標があれば座標(ズレない)、無ければ住所でフォールバック。
        const gmapUrl = (p.lat != null && p.lng != null)
          ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`
          : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address || "")}`;
        return `
        <div class="pin-card ${exported ? "exported" : ""} ${isChecked ? "checked" : ""} ${isSelected ? "selected" : ""} ${isPastRound(p) ? "past" : ""}" id="card-${p.id}" onclick="selectPin('${p.id}')">
          <div class="pin-card-top">
            <input type="checkbox" class="pin-check" ${isChecked ? "checked" : ""}
              onclick="toggleCheck('${p.id}',event)">
            ${p.seqNo != null ? `<span class="pin-seq">${fmtSeq(p.seqNo)}</span>` : ""}
            <span class="status-badge" style="background:${sColor};color:${sTextColor}">${sLabel}</span>
            ${p.otherCompany ? `<span class="oc-badge" title="他社看板">🏢 他社物件</span>` : ""}
            <span class="pin-date">${date}</span>
            <span class="pin-staff">${staffName(p.email)}</span>
            <button class="del-btn" onclick="deletePin('${p.id}',event)">🗑</button>
          </div>
          <div class="pin-detail-row">
            <span class="detail-label">所在</span>
            <input class="detail-input addr-input ${p.addressManual ? "manual" : ""}" value="${escAttr(p.address)}" placeholder="住所不明"
              onchange="saveAddress('${p.id}',this.value)" onclick="event.stopPropagation()">
            ${p.addressManual ? `<span class="manual-badge" title="手修正済み">✎手修正</span>` : ""}
          </div>
          <div class="pin-detail-row">
            <span class="detail-label">地番</span>
            <input class="detail-input ${p.chibanManual ? "manual" : ""}" value="${escAttr(p.chiban)}" placeholder="未入力"
              onchange="saveChiban('${p.id}',this.value)" onclick="event.stopPropagation()">
            ${p.chibanManual
              ? `<span class="manual-badge" title="手修正済み">✎手修正</span>`
              : ((p.reviewReason === "参考地番・要確認" && p.chibanManual !== true)
                  ? `<button class="confirm-ref-btn" onclick="confirmRefChiban('${p.id}',event)" title="この参考地番を正として確定（打ち直し不要）">✓ ${escAttr(p.chiban)} で確定</button>`
                  : "")}
          </div>
          ${p.memo ? `<div class="surveyor-memo">📝 調査員メモ：${escAttr(p.memo)}</div>` : ""}
          <div class="pin-detail-row memo-row">
            <span class="detail-label">メモ</span>
            <textarea class="detail-input memo-input" rows="2" placeholder="メモ（任意）"
              onchange="saveAdminMemo('${p.id}',this.value)" onclick="event.stopPropagation()">${escAttr(p.adminMemo)}</textarea>
          </div>
          <div class="pin-actions">
            <a class="sv-btn" href="${gmapUrl}" target="_blank" onclick="event.stopPropagation()">🗺 地図で開く</a>
            <select class="status-sel" onchange="updateStatus('${p.id}',this.value)" onclick="event.stopPropagation()">
              ${statusOptionsHTML(p.status)}
            </select>
          </div>
          <label class="oc-toggle" onclick="event.stopPropagation()">
            <input type="checkbox" ${p.otherCompany ? "checked" : ""} onchange="toggleOtherCompany('${p.id}',this.checked)"> 🏢 他社物件（他社看板）
          </label>
          ${exported ? `<div class="export-line">✓ Excel出力済 ${exportedMD}${exportedByName ? ` ・ ${exportedByName}` : ""}</div>` : ""}
        </div>`;
      }).join("");
    }

    // ===== CHECKBOX =====
    window.toggleCheck = (id, e) => {
      e.stopPropagation();
      if (checkedIds.has(id)) { checkedIds.delete(id); }
      else { checkedIds.add(id); }
      renderList();
    };

    // ===== 全選択 / 全解除（現在表示中のピン基準） =====
    window.toggleSelectAll = (el) => {
      const pins = filtered();
      if (el.checked) { pins.forEach(p => checkedIds.add(p.id)); }
      else { pins.forEach(p => checkedIds.delete(p.id)); }
      renderList();
    };

    // ===== DELETE 1件 =====
    window.deletePin = async (id, e) => {
      e.stopPropagation();
      if (!confirm("このピンを削除しますか？")) return;
      try {
        await deleteDoc(doc(db, "pins", id));
        checkedIds.delete(id);
        showToast("削除しました");
      } catch(e) { showToast("削除に失敗しました", "error"); }
    };

    // ===== DELETE まとめて =====
    window.bulkDelete = async () => {
      if (checkedIds.size === 0) return;
      // 反社/NG（永久ピン）は一括削除からも除外（二重ガード）。
      const ids = [...checkedIds].filter(id => { const p = allPins.find(x => x.id === id); return !(p && isPermanentPin(p)); });
      const skipped = checkedIds.size - ids.length;
      if (ids.length === 0) { showToast("反社/NGは一括削除の対象外です（個別に🗑で削除してください）", "warn"); return; }
      if (!confirm(`${ids.length}件を削除しますか？${skipped ? `（反社/NG ${skipped}件は一括対象外・個別削除は可）` : ""}`)) return;
      try {
        await Promise.all(ids.map(id => deleteDoc(doc(db, "pins", id))));
        ids.forEach(id => checkedIds.delete(id));
        showToast("削除しました");
      } catch(e) { showToast("削除に失敗しました", "error"); }
    };

    // ===== MAP MARKERS（ビューポートカリング）=====
    // 端末の重さは「地図に載っているウィジェット数」にほぼ比例する。5694件を全部描くと
    // 1ピン＝marker(+Z16以上はラベル)がピン総数に比例して積み上がり、起動と操作が止まる。
    // 描く対象を「可視範囲＋バッファ内」かつ「filtered() に残っている」ピンだけに絞り、
    // 地図の idle で差分更新する（描画済みは触らない＝パンのたびに全再生成しない）。
    const VIEW_BUFFER_RATIO = 0.15;   // 可視範囲を上下左右にこの割合ぶん広げる（パン時のチラつき防止）

    // バッファ込みの可視範囲。取れない場合は null＝カリングせず従来どおり全部描く（事務所を止めない）。
    // index.html と違い admin は initMap で rotatable を設定していない＝回転しないので、
    // 回転ぶんのはみ出し補正（index の rotationBufferRatio）は不要。
    function viewBounds() {
      if (!map) return null;
      let b;
      try { b = map.getLatLngBounds(); } catch (e) { return null; }
      if (!b) return null;
      const sw = b.getSouthWest(), ne = b.getNorthEast();
      const dLat = (ne.lat - sw.lat) * VIEW_BUFFER_RATIO;
      const dLng = (ne.lng - sw.lng) * VIEW_BUFFER_RATIO;
      return { south: sw.lat - dLat, north: ne.lat + dLat, west: sw.lng - dLng, east: ne.lng + dLng };
    }
    // admin の allPins はフラット形状（{id, ...data}）なので p をそのまま受ける（index は p.data 入れ子）。
    function inViewBounds(p, vb) {
      const lat = Number(p.lat), lng = Number(p.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;   // 座標欠落は描けない
      if (!vb) return true;   // 範囲が取れない時は従来どおり描く
      return lat >= vb.south && lat <= vb.north && lng >= vb.west && lng <= vb.east;
    }

    function removePinMarker(id) {
      const entry = pinWidgetMap.get(id);
      if (!entry) return;
      if (map) {
        if (entry.marker)      { try { map.removeWidget(entry.marker); } catch (e) {} }
        if (entry.labelWidget) { try { map.removeWidget(entry.labelWidget); } catch (e) {} }
      }
      pinWidgetMap.delete(id);
    }

    // 1ピンぶんの生成。色/ラベル/#001/他社🏢/過去周回の薄色の判定は従来と同一。
    function renderMarker(p) {
      removePinMarker(p.id);
      // 未定義ステータスでも落ちない・透明にならないようガード
      const s = STATUS[p.status] || EXCLUDE_STATUS[p.status];
      const isExclude = isExcludeCandidatePin(p);
      // マーカー色は「担当者(メール)ごとの固定色」。頭文字はステータスを示す。
      // 固定連番(seqNo)はマーカー上のHTMLオーバーレイ(#001形式)で表示する（下の UserWidget）。
      const marker = new ZDC.Marker(
        new ZDC.LatLng(p.lat, p.lng),
        {
          color: isPermanentPin(p) ? PERMANENT_COLOR : (isExclude ? EXCLUDE_COLOR : (s ? s.color : FALLBACK_COLOR)),
          text: s ? (s.text || s.label[0]) : "?"
        }
      );
      marker.pinId = p.id;
      marker.addEventListener("click", function() { selectPin(p.id); });
      map.addWidget(marker);

      let labelWidget = null;
      // ピン番号ラベル(#001形式)をマーカーの上にHTMLオーバーレイ表示。
      // seqNo が無い旧データには付けない。pointer-events:none でマーカークリックを邪魔しない。
      // Z16未満では描かない（広域で全ピンぶんのHTMLオーバーレイを作らない＝第一便の軽量化の本体）。
      // 判定は labelsShown ではなく都度 getZoom() を見る（差分追加されるピンにも正しく効く。index.html と同方式）。
      if (p.seqNo != null && map.getZoom() >= LABEL_MIN_ZOOM) {
        // 要確認（住所不明 or 地番未取得）は赤背景で示す。現地画面(index.html)と色基準を統一。
        // ラベル背景色：要確認赤 ＞ 永久黒 ＞ 周回色（担当者色は廃止）。過去周回の通常ピンは薄色。
        const labelBg = labelColor(p);
        const labelOpacity = isPastRound(p) ? ".45" : "1";
        // 他社物件フラグは背景色（色優先順位）を上書きせず、🏢＋黄土枠で重畳表示。
        const oc = p.otherCompany === true;
        const labelBorder = isExcludeCandidatePin(p) ? `2px solid ${EXCLUDE_BORDER}` : (oc ? "2px solid #CA8A04" : "1px solid rgba(255,255,255,.65)");
        const seqLabel = new ZDC.UserWidget(
          new ZDC.LatLng(p.lat, p.lng),
          {
            htmlSource:
              '<div style="transform:translateX(-50%);white-space:nowrap;'
              + 'padding:1px 6px;border-radius:9px;'
              + 'background:' + labelBg + ';color:#fff;'
              + 'font-size:11px;font-weight:700;line-height:1.6;'
              + 'border:' + labelBorder + ';'
              + 'box-shadow:0 1px 3px rgba(0,0,0,.35);'
              + 'opacity:' + labelOpacity + ';'
              + 'pointer-events:none;">' + fmtSeq(p.seqNo) + (oc ? ' 🏢' : '') + '</div>',
            offset: new ZDC.Point(0, -58),
            propagation: true,
          }
        );
        map.addWidget(seqLabel);
        labelWidget = seqLabel;   // marker と対で持ち、除去時に一緒に removeWidget する
      }
      pinWidgetMap.set(p.id, { marker, labelWidget });
    }

    // 可視範囲の変化に追従して差分更新（範囲内で未描画は追加／対象外は marker＋ラベルごと除去）。
    // 既に描画済みのピンは触らない＝パンのたびに全再生成しない。
    function relayoutVisiblePins() {
      if (!map) return;
      const vb = viewBounds();
      const keep = new Set();
      filteredPins.forEach(p => {
        if (!inViewBounds(p, vb)) return;
        keep.add(p.id);
        if (!pinWidgetMap.has(p.id)) renderMarker(p);
      });
      for (const id of Array.from(pinWidgetMap.keys())) {
        if (!keep.has(id)) removePinMarker(id);
      }
      updateMapCount();   // 「該当N件／地図M件」の更新はここ1箇所に集約する
    }

    // 全消し→可視範囲だけ描き直す。差分版は描画済みを触らないため、
    // 「見た目そのものが変わる」時（周回色・ステータス変更）と
    // 「重畳画像の上へピンを戻す」時（用途地域/地番レイヤ）はこちらを使う。
    function renderAllMarkers() {
      if (!map) return;
      // 今回の描画でラベルを描くか。idle の閾値跨ぎ判定がこの値を見るので、描く前に確定させる。
      labelsShown = map.getZoom() >= LABEL_MIN_ZOOM;
      for (const id of Array.from(pinWidgetMap.keys())) removePinMarker(id);
      relayoutVisiblePins();
    }

    // 一覧(filtered)と地図(カリング後)の件数を明示する。数の食い違いを説明できないと
    // 「ピンが消えた」と読まれるため、初期中心/倍率の変更と同じ便で入れる。
    function updateMapCount() {
      const el = document.getElementById("mapCount");
      if (!el) return;
      const n = filteredPins.length, m = pinWidgetMap.size;
      if (n > 0 && m === 0) {
        el.textContent = `該当 ${n}件／表示範囲に該当ピンがありません`;
        el.classList.add("warn");
      } else {
        el.textContent = `該当 ${n}件／地図 ${m}件`;
        el.classList.remove("warn");
      }
    }
    
    // ===== SELECT PIN =====
    window.selectPin = (id) => {
      selectedPinId = id;

      document.querySelectorAll(".pin-card").forEach(c => c.classList.remove("selected"));
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.classList.add("selected");
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        // 一時ハイライト：タップ毎に再生されるようリフローを挟んでアニメを付け直す
        card.classList.remove("flash");
        void card.offsetWidth;
        card.classList.add("flash");
      }

      // 地図は全再描画しない。マーカーの見た目は selectedPinId を参照しておらず
      // （色=status/永久/除外、ラベル=labelColor/isPastRound/otherCompany）、
      // 全再構築は表示中ぶんのウィジェットを作り直すだけで画面は1pxも変わらなかった
      // ＝「カード/ピンをクリックすると固まる」の主因（便②-0で削除）。
      // ズーム変化に伴う #001ラベルの出し入れは initMap 内の idle リスナが担当する。

      const pin = allPins.find(p => p.id === id);
      if (pin && map) {
        // 引いてたら閾値まで寄せ、既に寄ってたらズーム維持で中心だけ移動（事務員の作業ズームを壊さない）。
        const targetZoom = Math.max(map.getZoom(), ZOOM_READABLE);
        map.setCenter(new ZDC.LatLng(pin.lat, pin.lng));
        if (targetZoom !== map.getZoom()) map.setZoom(targetZoom);
        // レイヤON中は B-1 で追加の "idle" リスナが移動完了後に redrawActiveLayers() を呼び追従する。
        // カリング後は「可視範囲外のピンを一覧から選ぶ」場合に、移動先で描画し直す必要がある。
        // 通常は移動完了の idle が拾うが、既に同じ中心・同じズームだと idle が発火しない穴があるため
        // ここで明示的に1回呼ぶ（差分更新なので描画済みには触らず安価）。
        relayoutVisiblePins();
      }
    };

    // ===== SAVE 地番（手修正）=====
    // 手修正は自動再取得より優先。値があれば chibanManual を立て、空なら解除（自動再取得に委ねる）。
    // needsReview は住所・地番を合わせた最新状態で再計算（埋まればfalse／空に戻せばtrue）。
    window.saveChiban = async (id, value) => {
      const p = allPins.find(x => x.id === id) || {};
      const chiban = value.trim();
      const review = needsReviewNow({ ...p, chiban });
      try {
        const update = {
          chiban,
          chibanManual: chiban ? true : deleteField(),
          needsReview: review,
        };
        if (!review) update.reviewReason = deleteField();
        await updateDoc(doc(db, "pins", id), update);
        showToast("地番を保存しました");
      } catch(e) { showToast("保存に失敗しました", "error"); }
    };

    // ===== 参考地番の「そのまま確定」=====
    // 参考地番(近傍筆)を打ち直さず正として確定。chibanは現在値のまま、手修正フラグを立てて
    // 要確認を解除（saveChibanの打ち直し確定と最終状態が同じ）。対象は参考地番(未手修正)のみ。
    window.confirmRefChiban = async (id, e) => {
      e.stopPropagation();
      const p = allPins.find(x => x.id === id) || {};
      if (p.reviewReason !== "参考地番・要確認" || p.chibanManual === true) return;   // 二重ガード
      try {
        await updateDoc(doc(db, "pins", id), {
          chibanManual: true,
          needsReview: false,
          reviewReason: deleteField(),
        });
        showToast("地番を確定しました");
      } catch(e) { showToast("確定に失敗しました", "error"); }
    };

    // ===== SAVE 住所（手修正）=====
    // 住所と地番は別管理。値があれば addressManual を立て、空なら解除。
    // needsReview は住所・地番を合わせた最新状態で再計算する。
    window.saveAddress = async (id, value) => {
      const p = allPins.find(x => x.id === id) || {};
      const address = value.trim();
      // 参考地番(要確認)は住所補正だけでは確定しない＝赤を維持。地番確定時のみ解除。
      const isRefChiban = p.reviewReason === "参考地番・要確認" && p.chibanManual !== true;
      const review = needsReviewNow({ ...p, address }) || isRefChiban;
      try {
        const update = {
          address,
          addressManual: address ? true : deleteField(),
          needsReview: review,
        };
        if (!review) update.reviewReason = deleteField();
        await updateDoc(doc(db, "pins", id), update);
        showToast("住所を保存しました");
      } catch(e) { showToast("保存に失敗しました", "error"); }
    };

    // ===== 住所ジオコーディング＋反社/NG登録（管理画面専用） =====
    // 住所→座標は ZENRIN Web API forward（admin既存WMSと同じ3ヘッダ認証。word=住所→position=[lon,lat]）。
    async function geocodeAddress(word) {
      const url = "https://test-web.zmaps-api.com/search/address?word=" + encodeURIComponent(word);
      const res = await fetch(url, { headers: { "x-api-key": WMS_KEY, "Authorization": "referer" } });
      const it = (await res.json()).result?.item?.[0];
      if (!it || !Array.isArray(it.position)) return null;
      return { lng: it.position[0], lat: it.position[1], address: it.address || word };
    }

    // 一時マーカー(登録前の仮位置★)を消す。登録成功/キャンセル/モードOFF/住所未ヒットで呼ぶ。
    function clearRegTempMarker() {
      if (regTempMarker) { try { map.removeWidget(regTempMarker); } catch(e){} regTempMarker = null; }
    }

    // 入力住所へ地図移動＋一時マーカー（req1・汎用の地図移動機能）。
    window.geocodeJump = async () => {
      const el = document.getElementById("geoInput");
      const word = (el?.value || "").trim();
      if (!word) return;
      showToast("住所を検索中…");
      let g = null;
      try { g = await geocodeAddress(word); } catch(e) { g = null; }
      if (!g) { clearRegTempMarker(); showToast("住所が見つかりません", "error"); return; }
      lastGeoLatLng = { lat: g.lat, lng: g.lng, address: g.address };
      if (map) {
        map.setCenter(new ZDC.LatLng(g.lat, g.lng));
        map.setZoom(Math.max(map.getZoom(), 17));
        clearRegTempMarker();
        regTempMarker = new ZDC.Marker(new ZDC.LatLng(g.lat, g.lng), { color: "#F59E0B", text: "★" });
        map.addWidget(regTempMarker);
      }
      showToast("移動：" + g.address);
    };

    window.setRegStatus = (v) => { if (v === "hansha" || v === "ng") regStatus = v; };

    // 反社/NGピンの採番（index.html と同じ meta/counter 方式・欠番あり運用）。
    async function nextSeqNo() {
      const counterRef = doc(db, "meta", "counter");
      let seq;
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(counterRef);
        const next = snap.exists() ? (Number(snap.data().next) || 1) : 1;
        seq = next;
        tx.set(counterRef, { next: next + 1 }, { merge: true });
      });
      return seq;
    }

    // 反社/NG永久ピンを作成（住所登録・クリック登録の共通処理）。座標が最優先・住所はおまけ。
    async function createPermanentPin(lat, lng, address) {
      if (regStatus !== "hansha" && regStatus !== "ng") return false;
      const label = STATUS[regStatus]?.label || regStatus;
      if (!confirm(`この位置に「${label}」ピンを登録しますか？\n${address || "（住所なし）"}`)) { clearRegTempMarker(); return false; }
      try {
        const pinData = {
          uid: auth.currentUser?.uid || "",
          email: auth.currentUser?.email || "",
          lat, lng,
          address: address || "",
          chiban: "",
          status: regStatus,
          memo: "",
          branch: myBranch,
          needsReview: false,
          createdAt: new Date().toISOString(),
          seqNo: await nextSeqNo(),
        };
        await addDoc(collection(db, "pins"), pinData);   // onSnapshot が拾って自動再描画
        clearRegTempMarker();
        showToast(`「${label}」ピンを登録しました`);
        return true;
      } catch(e) { showToast("登録に失敗しました", "error"); console.error("createPermanentPin", e); return false; }
    }

    // 方法A：住所ジオコード座標に登録
    window.registerFromAddress = async () => {
      if (!lastGeoLatLng) { showToast("先に住所で地図へ移動してください", "warn"); return; }
      await createPermanentPin(lastGeoLatLng.lat, lastGeoLatLng.lng, lastGeoLatLng.address);
    };

    // 方法B：地図クリック登録モード ON/OFF
    // ボタン表示・カーソル・仮マーカー掃除を一括反映（トグルと自動OFFで共通利用）。
    function applyRegModeUI() {
      const btn = document.getElementById("regModeBtn");
      if (btn) { btn.classList.toggle("active", regMode); btn.textContent = regMode ? "📍クリック登録：ON" : "📍クリック登録：OFF"; }
      // カーソルは2モード共有。片方OFFでも他方がONなら crosshair を維持する。
      const mapEl = document.getElementById("map"); if (mapEl) mapEl.style.cursor = (regMode || kouzuMode) ? "crosshair" : "";
      if (!regMode) clearRegTempMarker();   // モードOFFで仮位置★を残さない
    }
    // 内部状態を真実として反映（ON/OFFを明示指定）。オートOFF等から呼ぶ。
    function setRegMode(on) {
      regMode = !!on;
      if (regMode && kouzuMode) setKouzuMode(false);   // 公図取得モードと排他（同時ONにしない）
      applyRegModeUI();
    }
    // ボタンから呼ぶトグル。旧: onclick="toggleRegMode(!regMode)" は regMode が module スコープ変数のため
    // インラインhandler(グローバル評価)から参照不可でReferenceError→ハンドラが落ちてON化しなかった。
    // 引数を取らず内部状態を反転するだけに修正。
    window.toggleRegMode = () => setRegMode(!regMode);

    // 方法Bのクリック時：reverseで住所補完（失敗しても座標優先で登録は継続）。
    async function registerFromClick(latlng) {
      let address = "";
      try {
        const r = await fetch(`https://zenrin-ptddjpvgeq-an.a.run.app?type=reverse&lat=${latlng.lat}&lon=${latlng.lng}`);
        address = (await r.json()).result?.item?.[0]?.address || "";
      } catch(e) { address = ""; }   // reverse失敗は無視（座標が最優先・住所はおまけ）
      const ok = await createPermanentPin(latlng.lat, latlng.lng, address);
      if (ok) setRegMode(false);   // 登録成功後は自動OFF（誤ピン防止）。失敗/キャンセルはON維持で再クリック可
    }

    // ===== 公図取得モード（地図クリックで登録・管理画面専用）=====
    // 反社/NG登録モードと排他。ONの間だけ地図クリックで登録モーダルを開く。
    function applyKouzuModeUI() {
      const btn = document.getElementById("kouzuModeBtn");
      if (btn) { btn.classList.toggle("active", kouzuMode); btn.textContent = kouzuMode ? "📄公図取得：ON" : "📄公図取得：OFF"; }
      const mapEl = document.getElementById("map");
      if (mapEl) mapEl.style.cursor = (kouzuMode || regMode) ? "crosshair" : "";
    }
    function setKouzuMode(on) {
      kouzuMode = !!on;
      if (kouzuMode && regMode) setRegMode(false);   // 反社/NG登録モードと排他
      applyKouzuModeUI();
    }
    window.toggleKouzuMode = () => setKouzuMode(!kouzuMode);

    // 登録モーダル：クリック座標を保留し、対象地番/メモ（どちらも任意）を入れて登録。
    // 取得者(email)・取得日(serverTimestamp)・所属店(myBranch)は自動付与。公図ファイルは持たない。
    function openKouzuModal(latlng) {
      kouzuPending = { lat: latlng.lat, lng: latlng.lng };
      const t = document.getElementById("kouzuTarget"); if (t) t.value = "";
      const n = document.getElementById("kouzuNote");   if (n) n.value = "";
      const ov = document.getElementById("kouzuModal"); if (ov) ov.style.display = "flex";
      if (t) setTimeout(() => t.focus(), 0);
    }
    window.closeKouzuModal = () => {
      kouzuPending = null;
      const ov = document.getElementById("kouzuModal"); if (ov) ov.style.display = "none";
    };
    window.saveKouzuMark = async () => {
      if (!kouzuPending) { closeKouzuModal(); return; }
      const btn = document.getElementById("kouzuSaveBtn");
      if (btn) btn.disabled = true;
      const data = {
        lat: kouzuPending.lat,
        lng: kouzuPending.lng,
        targetChiban: (document.getElementById("kouzuTarget")?.value || "").trim(),
        note: (document.getElementById("kouzuNote")?.value || "").trim(),
        createdBy: auth.currentUser?.email || "",
        branch: myBranch,
        createdAt: serverTimestamp(),
      };
      try {
        await addDoc(collection(db, "kouzu_marks"), data);   // onSnapshot が拾って自動描画
        closeKouzuModal();
        setKouzuMode(false);   // 登録後は自動OFF（誤登録防止・反社/NG登録と同思想）
        showToast("公図取得済みマークを登録しました");
      } catch(e) {
