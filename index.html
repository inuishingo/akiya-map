    // ===== GEOCODE（ZENRIN）=====
    // reverse プロキシから点/セルの item を取得（ピン・グリッド共通）。失敗時は例外。
    async function fetchReverseItem(lat, lng) {
      const res = await fetch(`https://zenrin-ptddjpvgeq-an.a.run.app?type=reverse&lat=${lat}&lon=${lng}`);
      const json = await res.json();
      return (json.result && json.result.item && json.result.item[0]) || null;
    }
    // reverse item → {areaCode, areaName}。areaName の郡除去正規化はこの1箇所に集約（ピン/グリッド共用）。
    // areaCode = 都道府県コード(2桁)+市区町村コード(3桁) = JIS5桁（政令市は区まで分離）。欠落時 null（推測しない）。
    // 「◯◯郡△△町/村」は郡名を除去。「郡」始まりの市名(郡上市/郡山市)や 市・区は対象外（末尾が町/村の時だけ除去）。
    function areaFromReverseItem(item) {
      if (!item || !item.address_code2 || !item.address_code3) return { areaCode: null, areaName: null };
      const areaCode = String(item.address_code2).padStart(2, "0") + String(item.address_code3).padStart(3, "0");
      const a3 = item.address3 || "";
      const gm = a3.match(/^.+?郡(.+[町村])$/);
      return { areaCode: areaCode, areaName: gm ? gm[1] : (a3 || null) };
    }
    async function reverseGeocode(latlng) {
      document.getElementById("addressLabel").textContent = "住所取得中…";
      pendingAreaCode = null; pendingAreaName = null;   // 新規タップごとにリセット（失敗時はnullのまま保存）
      pendingAddress = null;                            // null=未取得。保存時に待つかどうかの判定に使う
      try {
        const item = await fetchReverseItem(latlng.lat, latlng.lng);
        document.getElementById("addressLabel").textContent = (item && item.address) || "住所不明";
        pendingAddress = (item && item.address) || "";  // 取れなければ空文字（"住所不明"は表示専用）
        const a = areaFromReverseItem(item);
        pendingAreaCode = a.areaCode; pendingAreaName = a.areaName;
      } catch {
        document.getElementById("addressLabel").textContent = "（オフライン）";
        pendingAddress = "";                            // 表示は「（オフライン）」でも保存は空文字
      }
    }

    // ===== 地番取得（ZENRIN reverse + bm）=====
    // 親番は reverse(point-in-polygon)を信頼し detail2 から採用（reverseが付ける枝番は誤り得るので捨てる）。
    // 枝番は bm の「同一親番の候補(bare親番＋枝番)」から最近傍で確定（点に最も近い筆＝196/59-2等）。
    //   ① 住居表示地区/地番未確定点(reverseが親番を出せない)は【方針B】bm最近傍筆(≤15m)を
    //      参考地番として採用し pendingChibanRef=true(要確認)。号は使わず筆自身の地番を使う。閾値超は空欄。
    //   ② 親番内に近接する複数枝番がある地点(例#609)は距離で割れ得る＝据置・要確認運用。
    // 数値は全角で返るため NFKC で半角化。取得結果は pendingChiban（自動値の基準）に
    // 保持しつつ、新規追加時は地番入力欄(#chibanInput)へ反映して現場で修正できるようにする。
    async function fetchChiban(latlng) {
      pendingChiban = "";
      pendingChibanRef = false;
      let manualReason = "";   // 自動取得できない理由（UI表示用）
      const REF_MAX_DIST = 15; // 参考地番(近傍筆)を採用する最大距離(m)。実ピン9点(最大13.4m)で確定。
      const norm = (s) => (typeof s === "string" ? s.normalize("NFKC").trim() : "");
      const input = document.getElementById("chibanInput");
      const refNote = document.getElementById("chibanRefNote");
      // 住居表示地区/地番未確定点用: bm最近傍筆の地番(detail2-branch2)を参考地番として返す。
      // reverse検証なし・号は使わない(筆自身のdetail2を使う)ので号→地番の事故は起きない。
      // 閾値内なら {chiban}、圏外/失敗はnull。
      const refFromNearestParcel = async () => {
        try {
          const bmRes = await fetch(
            `https://zenrin-ptddjpvgeq-an.a.run.app?type=bm&lat=${latlng.lat}&lon=${latlng.lng}`
          );
          const items = (await bmRes.json()).result?.item;
          if (!Array.isArray(items) || !items.length) return null;
          const best = items
            .filter((x) => typeof x.distance === "number")
            .sort((a, b) => a.distance - b.distance)[0];
          if (!best || best.distance > REF_MAX_DIST) return null;
          const ban = norm(best.address_detail2);
          if (!ban) return null;
          const eda = norm(best.address_branch2);
          return { chiban: eda ? `${ban}-${eda}` : ban };
        } catch { return null; }
      };
      try {
        // --- 親番: reverse（地番レベル TBN のときのみ有効）---
        const revRes = await fetch(
          `https://zenrin-ptddjpvgeq-an.a.run.app?type=reverse&lat=${latlng.lat}&lon=${latlng.lng}`
        );
        const revJson = await revRes.json();
        const revItem = revJson.result?.item?.[0];
        // 方針B: reverseで親番が出せない点は近傍筆を参考地番(要確認)に倒す。
        //   level!=TBN(GIK/AZC等)＝号/街区までしか出ない, TBN+detail1＝detail2は号で地番でない。
        //   号は使わず bm最近傍筆自身の地番を採用(号→地番の事故なし)。閾値超は空欄(手入力)。
        const noOyaban = !revItem || revItem.address_level !== "TBN" || norm(revItem.address_detail1);
        if (noOyaban) {
          manualReason = "住居表示地区";
          const ref = await refFromNearestParcel();
          if (ref) { pendingChiban = ref.chiban; pendingChibanRef = true; }
          return;
        }
        // 親番のみ採用：reverse が付ける枝番は誤り得る（例③ 196-2/213-2）ので "-" 以降を捨てる。
        const oyaban = norm(revItem.address_detail2).split("-")[0];
        if (!oyaban) return;

        // --- 枝番: bm の「同一親番」候補（bare親番＋枝番すべて）から最近傍で確定 ---
        //   点に最も近い筆を採用。bare最寄り→親番のみ(例③#1300:196) / 枝番最寄り→親番-枝番(例 正常#649:59-2)。
        let result = oyaban;   // 既定は親番のみ（bm に同一親番が無い/失敗時）
        try {
          const bmRes = await fetch(
            `https://zenrin-ptddjpvgeq-an.a.run.app?type=bm&lat=${latlng.lat}&lon=${latlng.lng}`
          );
          const bmJson = await bmRes.json();
          const items = bmJson.result?.item;
          if (Array.isArray(items)) {
            const best = items
              .filter((x) => norm(x.address_detail2) === oyaban)   // 同一親番（bare/枝番とも）
              .sort((a, b) => a.distance - b.distance)[0];
            if (best) {
              const eda = norm(best.address_branch2);
              result = eda ? `${oyaban}-${eda}` : oyaban;
            }
          }
        } catch {
          // bm 失敗時は親番のみで確定（result=oyaban のまま）
        }
        pendingChiban = result;
      } catch {
        // オフライン・取得失敗時は地番なしで保存
      } finally {
        // 新規追加時のみ自動値を入力欄へ反映（編集中は手入力値を保持）。
        if (!editingPinId && input) {
          input.value = pendingChiban;
          input.placeholder = pendingChiban ? "地番"
            : (manualReason ? `地番（${manualReason}・要手入力）` : "地番（自動取得できず・手入力）");
          if (refNote) refNote.style.display = (pendingChiban && pendingChibanRef) ? "block" : "none";
        }
      }
    }

    // ===== 固定連番の採番 =====
    // meta/counter を runTransaction で読み→その値を返し→next を+1。
    // 同時登録でも番号が衝突しない。番号は一度振ったら固定（削除しても繰り上げない＝欠番あり運用）。
    // 初期状態（ドキュメント無し）は next:1 から開始。
    async function nextSeqNo() {
      const counterRef = doc(db, "meta", "counter");
      let seq;
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(counterRef);
        const next = snap.exists() ? (Number(snap.data().next) || 1) : 1;
        seq = next;
        tx.set(counterRef, { next: next + 1 }, { merge: true });
      });
      return seq;
    }

    // ===== SAVE PIN =====
    window.savePin = async () => {
      if (!pendingLatLng && !editingPinId) return;
      const status = document.querySelector('input[name="status"]:checked')?.value;
      if (!status) { showToast("ステータスを選択してください", "warn"); return; }
      const memo   = document.getElementById("memo").value.trim();
      const otherCompanyEl = document.getElementById("otherCompanyCheck");
      const otherCompany = otherCompanyEl ? otherCompanyEl.checked : false;
      const excludeEl = document.getElementById("excludeCandidateCheck");
      let excludeCandidate = excludeEl ? !!excludeEl.checked : false;
      // 除外モード表示中は必ず除外候補フラグを立てる（チェック要素が無いケースへの保険）
      if (excludeCandidateMode) excludeCandidate = true;
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.textContent = "保存中…";

      const chiban = document.getElementById("chibanInput").value.trim();

      if (editingPinId) {
        try {
          // 【意図的な仕様変更】address を update から外す。
          // indexの住所欄は表示専用のdivで、ラベルには "取得中…" 等のUI文字列が入り得るため、
          // 書き戻すとプレースホルダが保存される。さらに、事務方がadminで手入力した住所を
          // 調査員の編集保存が上書きしてしまう経路にもなっていた。indexからは住所を変更しない。
          const update = { status, memo, otherCompany, excludeCandidate };
          console.log("[debug] update payload:", update);
          // 地番を手修正したときだけ chiban を更新し、手修正フラグ(chibanManual)を
          // 立てて要確認フラグを解除する（手修正は自動再取得より優先）。
          if (chiban !== (editingPinData?.chiban || "")) {
            update.chiban = chiban;
            update.chibanManual = true;
            update.needsReview = false;
            update.reviewReason = deleteField();
          }
          await updateDoc(doc(db, "pins", editingPinId), update);
          showToast("更新しました");
          closeModal();
        } catch(e) {
          showToast("更新に失敗しました", "error");
        }
      } else {
        // reverse が未完了なら最大1.5秒だけ待つ（実測 中央値0.22秒／10回平均0.226秒）。
        // モーダルは reverse を待たずに開くため、素早く連続でピンを立てると
        // 完了前に保存できてしまい "住所取得中…" が保存されていた（実測8件）。
        // 待ち切れなければ住所は空のまま保存し要確認を立てる＝現場を止めない。
        if (pendingAddress === null && pendingReverse) {
          await Promise.race([pendingReverse, new Promise(r => setTimeout(r, 1500))]);
        }
        const addrPending = (pendingAddress === null);
        const address = pendingAddress || "";
        const pinData = {
          uid: currentUser.uid,
          email: currentUser.email,
          lat: pendingLatLng.lat,
          lng: pendingLatLng.lng,
          address,
          chiban,
          // 自動値から変更して保存した場合は手修正扱い（自動再取得で上書きしない）。
          chibanManual: chiban !== (pendingChiban || ""),
          status,
          memo,
          otherCompany,       // 他社所有/媒介の属性（状態とは独立・boolean）
          excludeCandidate,
          areaCode: pendingAreaCode,   // reverse由来のJIS5桁市区町村コード（失敗時null・推測しない）
          areaName: pendingAreaName,   // reverse由来の市区町村名（政令市は区／失敗時null）
          surveyRound: (roundState[`${myBranch}__${pendingAreaCode}`]?.currentRound) ?? 1,   // そのエリアの現在周回（未取得/未判定=1・現場を止めない）
          branch: myBranch,   // ログイン調査員の所属店（loadMyBranchで確定。名古屋員は"名古屋"のまま）
          createdAt: new Date().toISOString(),
        };
        console.log("[debug] pinData before save:", pinData);
        // 参考地番(近傍筆・住居表示地区)を現場でそのまま採用＝要確認フラグを立てる。
        // 手修正して確定した場合(chibanManual=true)は対象外＝確定扱い。
        if (pendingChibanRef && chiban && chiban === pendingChiban) {
          pinData.needsReview = true;
          pinData.reviewReason = "参考地番・要確認";
        }
        // reverse を待ち切れずに保存した場合。両方に該当するときは参考地番の理由を優先して残す
        // （admin側が reviewReason==="参考地番・要確認" の完全一致で表示・地番確定の二重ガードを
        //   掛けているため、併記にするとそのガードが外れる）。住所が空なことで事務方は気づける。
        if (addrPending && !pinData.needsReview) {
          pinData.needsReview = true;
          pinData.reviewReason = "住所未取得・要確認";
        }
        if (navigator.onLine) {
          try {
            // 固定連番を採番してから保存（オンライン時のみ。オフラインは同期時に採番）。
            pinData.seqNo = await nextSeqNo();
            const ref = await addDoc(collection(db, "pins"), pinData);
            undoPush({ kind: "doc", id: ref.id });   // 直近作成としてUndo対象に積む
            // 保存直後の即時描画も表示対象判定を通す（保存中に画面外へパンした場合は描かない。onSnapshot/idleが拾う）
            if (shouldRenderPin(pinData, viewBounds())) renderMarker(ref.id, pinData);
            console.log("[debug] rendered after save:", ref.id, pinData);
            showToast("保存しました");
          } catch(e) {
            offlineQueue.push(pinData);
            localStorage.setItem("offlineQueue", JSON.stringify(offlineQueue));
            undoPush({ kind: "queued", item: pinData });   // IDが無いのでオブジェクト参照で持つ
            showToast("オフライン保存（後で自動送信）", "warn");
          }
        } else {
          offlineQueue.push(pinData);
          localStorage.setItem("offlineQueue", JSON.stringify(offlineQueue));
          undoPush({ kind: "queued", item: pinData });     // 同上（同期時に doc へ昇格する）
          showToast("オフライン保存（後で自動送信）", "warn");
        }
        closeModal();
      }
      btn.disabled = false;
      btn.textContent = "保存";
    };

    // ===== DELETE PIN =====
    // 楽観削除の中核。押した瞬間にUIから消す。実削除の確定はonSnapshotの"removed"でも起きる。
    // 低速回線でawaitが転けても削除は後でサーバーに反映されるので、成功表示は呼び出し側で先に出す（誤エラー対策）。
    // 個別削除(deletePin)とUndo(undoLastPin)の両方から使う。
    async function removePinDoc(id) {
      removePinMarker(id);
      try {
        await deleteDoc(doc(db, "pins", id));
      } catch (e) {
        // 本当の失敗（権限）だけ通知。ネットワーク一時失敗は黙認（Firestore再送＋onSnapshotで確定）。
        // 権限で消せていない場合、lastPinDocsに残り次のidleのrelayoutVisiblePinsでピンが戻る＝実態を反映。
        if (e && e.code === "permission-denied") showToast("削除できませんでした（権限）", "error");
      }
    }
    window.deletePin = async () => {
      if (!editingPinId) return;
      if (!confirm("このピンを削除しますか？")) return;
      const id = editingPinId;            // closeModalでnullになる前に控える
      closeModal();
      showToast("削除しました");
      await removePinDoc(id);
    };

    // ===== UNDO（直近に自分が立てたピンを1タップで戻す）=====
    // 現場FB：ピンが乱立していると、消したいピンをタップするつもりで隣を誤爆する。
    // 「今の1本を取り消す」だけに用途を絞り、確認ダイアログ無しで即実行する（LIFOで1つずつ遡れる）。
    //
    // スタックには2種類が入る：
    //   {kind:"doc",    id}   … オンライン作成。docIDが確定している
    //   {kind:"queued", item} … オフライン作成。IDが無いので offlineQueue の要素を参照で持つ
    // このアプリはFirestoreのオフライン永続を使わず自前のlocalStorageキューなので、
    // オフライン作成分を積まないとUndoが1つズレて「別のピンが消える」事故になる。必ず両方積む。
    function undoPush(entry) {
      undoStack.push(entry);
      if (undoStack.length > UNDO_MAX) undoStack.shift();   // 古い方から捨てる
      updateUndoBtn();
    }
    // オフライン作成が同期されてIDが確定したら doc へ昇格させる（同期後もUndoできるようにする）。
    function undoUpgradeQueued(item, id) {
      for (let i = 0; i < undoStack.length; i++) {
        if (undoStack[i].kind === "queued" && undoStack[i].item === item) {
          undoStack[i] = { kind: "doc", id: id };
          return;
        }
      }
    }
    function updateUndoBtn() {
      const b = document.getElementById("undoBtn");
      if (b) b.disabled = undoStack.length === 0;
    }
    window.undoLastPin = async () => {
      while (undoStack.length) {
        const top = undoStack.pop();
        if (top.kind === "queued") {
          // 未同期のまま＝キューから抜くだけで「作成そのもの」を取り消せる。
          const i = offlineQueue.indexOf(top.item);
          if (i < 0) continue;             // 既に同期済み等（昇格漏れ）＝この分は戻せないので次へ
          offlineQueue.splice(i, 1);
          localStorage.setItem("offlineQueue", JSON.stringify(offlineQueue));
          updateUndoBtn();
          showToast("1件戻しました");
          return;
        }
        // 手動で先に消された等でもう存在しないものは飛ばして次へ（追加の読み取りはせずスナップショットで判定）。
        if (!lastPinDocs.some(p => p.id === top.id)) continue;
        await removePinDoc(top.id);
        updateUndoBtn();
        showToast("1件戻しました");
        return;
      }
      updateUndoBtn();
      showToast("戻せるピンがありません", "warn");
    };

    // ===== TOAST =====
    function showToast(msg, type = "ok") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast " + type;
      t.style.opacity = "1";
      setTimeout(() => { t.style.opacity = "0"; }, 2800);
    }

    // ===== 現在地（青ドット）=====
    // 物件ピン(renderMarker)は ZDC.Marker のティアドロップ型＋頭文字＋#001ラベル。
    // 現在地は同じ ZDC.UserWidget API（seqLabelと同じ作法）で、形の違う「青い丸ドット
    // ＋白縁＋パルス」を出して明確に区別する。更新は removeWidget→addWidget（既存と同じ作法）。
    // ピン用ウィジェット管理Mapには入れない＝listenPins()の消去ループで消えず、現在地は出しっぱなし。
    function showMyLocation(lat, lng) {
      if (!map) return;
      if (myLocationMarker) { map.removeWidget(myLocationMarker); myLocationMarker = null; }
      // 正常表示の seqLabel と同じ作法：横中央寄せは transform:translateX(-50%)、縦位置は offset で調整。
      // 18pxドットを点に重ねるため offset Y=-9（高さ半分ぶん上げて中心を点に合わせる）。
      // パルスは単一要素の box-shadow アニメ（実寸0崩れ・widget内クリップ回避）。
      myLocationMarker = new ZDC.UserWidget(
        new ZDC.LatLng(lat, lng),
        {
          htmlSource:
            '<div style="transform:translateX(-50%);'
            + 'width:18px;height:18px;border-radius:50%;'
            + 'background:#2563EB;border:2px solid #fff;'
            + 'box-shadow:0 0 0 0 rgba(37,99,235,.5);'
            + 'animation:locPulse 1.6s ease-out infinite;'
            + 'pointer-events:none;"></div>',
          offset: new ZDC.Point(0, -9),
          propagation: true,
        }
      );
      map.addWidget(myLocationMarker);
    }

    // ===== 追従モード（カーナビ式）=====
    // followMode=true: 現在地に地図を追従。手動で地図を動かすと解除、📍で復帰。
    function setFollow(on) {
      if (followMode === on) return;
      followMode = on;
      updateLocateBtn();
    }
    function updateLocateBtn() {
      const b = document.querySelector(".locate-btn");
      if (b) b.classList.toggle("following", followMode); // ON=青塗り / OFF=グレー
    }

    // watchPosition で継続追跡。位置更新ごとに青ドットを更新し、追従中のみ地図も寄せる。
    function startLocationWatch() {
      if (watchId != null) return;             // 二重起動防止
      if (!navigator.geolocation) return;
      watchId = navigator.geolocation.watchPosition(
        pos => {
          if (pos.coords.accuracy > 1000) return;  // 既存ガード踏襲（粗い測位は無視）
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          showMyLocation(lat, lng);                // 青ドットは常に現在地へ（followの有無に関係なく）
          if (followMode) { map.setCenter(new ZDC.LatLng(lat, lng)); } // 追従中のみ地図も追従
          // 進行方向↑用：移動中はGPSの進行方向を優先する。停止時は heading が null になるためコンパスへ戻す。
          // ON/OFFで別のしきい値を使う＝ヒステリシス（境界の速度で方位源をバタつかせない）。
          const sp = pos.coords.speed;
          if (typeof sp === "number" && !isNaN(sp)) {
            const prevSrc = useGpsHeading;
            if (!useGpsHeading && sp >= GPS_SPEED_ON) useGpsHeading = true;
            else if (useGpsHeading && sp < GPS_SPEED_OFF) useGpsHeading = false;
            if (prevSrc !== useGpsHeading) { headBufSin = []; headBufCos = []; } // 方位源が変わったら平滑化をやり直す
          }
          if (typeof pos.coords.heading === "number" && !isNaN(pos.coords.heading)) {
            gpsHeading = pos.coords.heading;   // GPSの進行方向は真北基準・時計回り＝正規化不要
            gpsHeadingAt = Date.now();
          }
          if (headingUpMode) requestHeadingApply();
        },
        () => { /* 取得失敗は無視（前回位置を維持） */ },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 5000 }
      );
    }

    // 地図の手動パン検出：地図DOMへのタッチ/マウスのドラッグだけを「手動操作」とみなす。
    // プログラムからの map.setCenter は touch/mouse 入力を発生させないため、追従中の自動寄せを
    // 手動操作と誤判定しない（isAutoMovingフラグ不要）。タップ(ピン追加)は移動量しきい値で除外。
    function attachManualPanDetection() {
      const el = document.getElementById("map");
      if (!el) return;
      let startXY = null, mouseDown = false;
      el.addEventListener("touchstart", e => {
        startXY = (e.touches && e.touches.length === 1)
          ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
      }, { capture: true, passive: true });
      el.addEventListener("touchmove", e => {
        if (!startXY || !e.touches || e.touches.length !== 1) return; // ピンチズームは対象外
        const dx = e.touches[0].clientX - startXY.x, dy = e.touches[0].clientY - startXY.y;
        if (Math.hypot(dx, dy) > 8) setFollow(false);  // 8px超え＝ドラッグ＝手動操作で追従解除
      }, { capture: true, passive: true });
      // PC（マウスドラッグ）
      el.addEventListener("mousedown", () => { mouseDown = true; }, { capture: true });
      el.addEventListener("mousemove", () => { if (mouseDown) setFollow(false); }, { capture: true });
      window.addEventListener("mouseup", () => { mouseDown = false; }, true);
    }

    // ===== 進行方向↑（ヘディングアップ自動回転）=====
    // ZDCネイティブ回転(map.setHeading)を使う。CSSでコンテナを回す方式ではないので、
    // ピン・#001ラベル・現在地ドット（いずれもDOMオーバーレイ）は正立を保ち、タップ座標もズレない。
    // tiltは使わず2Dの方位回転のみ。
    //
    // 【符号】ZDC本体の getViewMat はカメラのup方向を (cos h, sin h) で持ち、core は h = 90°-K
    // （K = setHeading の引数）で変換する。よって setHeading(K) は「真北から時計回りにK度の方位」を
    // 画面上に向ける＝方位角をそのまま渡せる。公式ドキュメントは mapOptions.heading(時計回り正) と
    // setHeading(反時計回り正) で記述が矛盾しているため、コード側は「真北から時計回りの方位角」で
    // 統一し、ZDC側の符号は HEADING_SIGN 1箇所だけで吸収する。
    const HEADING_SIGN      = 1;    // 実機15°テストで確定。逆に回ったらここを -1 に（他は触らない）
    const SCREEN_ANGLE_SIGN = 1;    // Androidの画面回転補正の符号。横持ちでズレたら -1
    const DECLINATION       = 0;    // 偏角補正（名古屋≒7.5°W）。現状は入れない＝後から定数だけで有効化できる
    const HEADING_HZ        = 10;   // setHeading の適用上限。コンパスの生イベント(〜60Hz)は必ずここで間引く
    const HEADING_AVG_N     = 12;   // sin/cos移動平均の窓＝ローパス。大きいほど滑らかで追従が遅れる（実機調整で8→12）
    // デッドバンド。これ未満の変化では setHeading を呼ばない。無駄な _update と再描画を抑えるだけでなく、
    // 「まっすぐ歩いている間の微ブレで地図が動いて酔う」を直接消すのが主目的（実機フィードバックで1.5→3）。
    // 実際の旋回は一発で閾値を超えるので、追従のラグは増えない。
    const HEADING_MIN_DELTA = 3;
    const GPS_SPEED_ON      = 1.5;  // m/s。これ以上でGPS進行方向へ切替（徒歩前提で低め）
    const GPS_SPEED_OFF     = 0.8;  // m/s。これ未満でコンパスへ戻す。ON/OFFの差＝ヒステリシス
    const GPS_HEADING_TTL   = 5000; // ms。これより古いGPS方位は使わない
    const MANUAL_TWIST_DEG  = 10;   // 2本指でこれ以上ひねったら自動回転を一時解除
    const ORIENT_WATCHDOG_MS = 3000; // この時間に使える方位が1つも来なければセンサー無しとみなす

    let orientHandler   = null;   // deviceorientation系ハンドラ。OFF時に removeEventListener するため保持
    let orientEventName = null;   // 実際に購読しているイベント名
    let orientPermitted = false;  // iOS: 一度grantedを取ったら保持し、再ON時に再要求しない
    let orientGotSample = false;  // 使える方位が1つでも来たか（センサー無しの検出用）
    let orientWatchdog  = null;
    let headBufSin = [], headBufCos = [];
    let lastAppliedHeading = null, lastHeadingApplyAt = 0, headingThrottleId = null;
    let gpsHeading = null, gpsHeadingAt = 0, useGpsHeading = false;

    // 0°/360°をまたいでも正しい最小角度差を返す
    function angleDiff(a, b) {
      const d = ((a - b) % 360 + 360) % 360;
      return d > 180 ? 360 - d : d;
    }

    // 回転中は getLatLngBounds が heading 非考慮の軸並行矩形を返すため、画面四隅がその外にはみ出す。
    // はみ出し量 |cos|+|sin|-1（0〜0.414）を可視範囲バッファに上乗せして、
    // 「見えているのに角のピン/マスが消える」事故を防ぐ。heading=0 のときは 0＝従来と同じ挙動。
    function rotationBufferRatio() {
      if (!map || typeof map.getHeading !== "function") return 0;
      let h = 0;
      try { h = map.getHeading() || 0; } catch (e) { return 0; }
      if (!h) return 0;
      const r = (h % 90) * Math.PI / 180;
      return Math.abs(Math.sin(r)) + Math.abs(Math.cos(r)) - 1;
    }

    // ZDCへの唯一の回転指示。引数は「真北から時計回りの方位角(度)」で統一する。
    function applyHeading(bearingDeg) {
      if (!map || typeof map.setHeading !== "function") return;
      const n = Number(bearingDeg);
      if (!Number.isFinite(n)) return;
      const b = ((n + DECLINATION) % 360 + 360) % 360;
      try { map.setHeading((b * HEADING_SIGN % 360 + 360) % 360); }
      catch (e) { /* 回転非対応・失敗でも落とさない＝北固定のまま通常動作を続ける */ }
    }
    function resetHeadingNorth() {
      lastAppliedHeading = null;
      headBufSin = []; headBufCos = [];
      applyHeading(0);
    }

    // 方位の平滑化：角度を直接平均すると 359°と1° の平均が180°になって暴れる。
    // 単位ベクトル(sin,cos)で平均してから角度に戻す＝巻き戻りが構造的に起きず、そのままローパスになる。
    function pushHeadingSample(deg) {
      const r = deg * Math.PI / 180;
      headBufSin.push(Math.sin(r)); headBufCos.push(Math.cos(r));
      if (headBufSin.length > HEADING_AVG_N) { headBufSin.shift(); headBufCos.shift(); }
    }
    function smoothedHeading() {
      if (!headBufSin.length) return null;
      let s = 0, c = 0;
      for (let i = 0; i < headBufSin.length; i++) { s += headBufSin[i]; c += headBufCos[i]; }
      if (Math.abs(s) < 1e-6 && Math.abs(c) < 1e-6) return null;   // 打ち消し合った＝方位が定まらない
      return (Math.atan2(s, c) * 180 / Math.PI + 360) % 360;
    }

    // iOSとAndroidで基準も向きも違うので、ここで「真北・時計回り 0-359」に揃える。
    function normalizeCompass(e) {
      // iOS(WebKit): webkitCompassHeading は真北基準・時計回り。そのまま使える。
      if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) {
        return (e.webkitCompassHeading % 360 + 360) % 360;
      }
      // Android(Chrome): alpha は磁北基準・反時計回り。360-alpha で時計回りへ反転し、画面回転ぶんを補正。
      if (typeof e.alpha === "number" && !isNaN(e.alpha)
          && (e.absolute === true || orientEventName === "deviceorientationabsolute")) {
        let scr = 0;
        try {
          if (screen.orientation && typeof screen.orientation.angle === "number") scr = screen.orientation.angle;
        } catch (err) { /* 参照できない環境は補正なし */ }
        return ((360 - e.alpha + SCREEN_ANGLE_SIGN * scr) % 360 + 360) % 360;
      }
      return null;   // 絶対方位が取れないイベントは使わない（北固定のまま）
    }

    // 採用する方位：移動中はGPS進行方向、停止中はコンパス。切替はヒステリシス付き。
    // 空家調査は停止時間が支配的なので、実運用ではコンパスが主・GPSが従になる。
    function currentHeading() {
      if (useGpsHeading && gpsHeading != null && (Date.now() - gpsHeadingAt) < GPS_HEADING_TTL) return gpsHeading;
      return smoothedHeading();
    }

    // setHeading をスロットルして適用。回転のたび _update が飛んで表示中の全ピンDOMの位置が
    // 再計算されるため、センサーの生イベントをそのまま流さないことが必須。
    function requestHeadingApply() {
      if (!headingUpMode || headingUpPaused) return;
      const minGap = 1000 / HEADING_HZ;
      const now = Date.now();
      const wait = minGap - (now - lastHeadingApplyAt);
      if (wait > 0) {
        if (headingThrottleId == null) {
          headingThrottleId = setTimeout(function() { headingThrottleId = null; requestHeadingApply(); }, wait);
        }
        return;
      }
      const h = currentHeading();
      if (h == null) return;
      if (lastAppliedHeading != null && angleDiff(h, lastAppliedHeading) < HEADING_MIN_DELTA) return; // 微小な揺れは無視
      lastHeadingApplyAt = now;
      lastAppliedHeading = h;
      applyHeading(h);
    }

    // iOSは requestPermission がユーザー操作起点でしか通らない＝必ずトグルのタップハンドラから呼ぶ。
    // 一度grantedを取れば orientPermitted に保持し、再ON時は再要求しない（未許可のときだけ呼ぶ）。
    async function ensureOrientationPermission() {
      if (!window.DeviceOrientationEvent) return false;
      if (orientPermitted) return true;
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          orientPermitted = (await DeviceOrientationEvent.requestPermission()) === "granted";
          return orientPermitted;
        } catch (e) { return false; }   // 拒否・ユーザー操作起点でない
      }
      orientPermitted = true;   // Android等は許可不要
      return true;
    }

    function startOrientationWatch() {
      if (orientHandler) return;
      // absolute(真北基準)が取れる方を優先。無ければ通常の deviceorientation にフォールバック。
      orientEventName = ("ondeviceorientationabsolute" in window) ? "deviceorientationabsolute" : "deviceorientation";
      orientGotSample = false;
      orientHandler = function(e) {
        if (!headingUpMode || headingUpPaused) return;
        if (useGpsHeading) return;                  // 移動中はGPS進行方向を優先
        const h = normalizeCompass(e);
        if (h == null) return;
        orientGotSample = true;
        pushHeadingSample(h);
        requestHeadingApply();
      };
      window.addEventListener(orientEventName, orientHandler);
      // センサー非搭載・イベントが来ない端末で「ONにしたのに何も起きない」を放置しない。
      orientWatchdog = setTimeout(function() {
        orientWatchdog = null;
        if (!headingUpMode || orientGotSample || useGpsHeading) return;
        showToast("方位センサーが使えないため北固定に戻します", "warn");
        setHeadingUp(false);
      }, ORIENT_WATCHDOG_MS);
    }
    // OFF時は必ず購読を解除する（電池と、無駄な再描画の抑制）。
    function stopOrientationWatch() {
      if (orientHandler && orientEventName) window.removeEventListener(orientEventName, orientHandler);
      orientHandler = null;
      if (orientWatchdog != null) { clearTimeout(orientWatchdog); orientWatchdog = null; }
      if (headingThrottleId != null) { clearTimeout(headingThrottleId); headingThrottleId = null; }
    }

    // モードの切替。北復帰は「OFFにして北へ戻す」の1操作にする。
    // モードONのまま setHeading(0) しても、次のセンサー更新で即上書きされて無意味なため。
    function setHeadingUp(on) {
      headingUpMode = !!on;
      headingUpPaused = false;
      if (headingUpMode) {
        headBufSin = []; headBufCos = []; lastAppliedHeading = null;
        startOrientationWatch();
        startLocationWatch();     // GPS進行方向のため（watchIdで二重起動しない）
        requestHeadingApply();
      } else {
        stopOrientationWatch();
        useGpsHeading = false;
        resetHeadingNorth();      // 北固定へ
      }
      updateCompassState();
    }
    // 状態表示は右上のZDCコンパスに集約する（専用の⬆FABは廃止）。
    // ZDCの構造は div.zwgl-ctrl-group > button.zwgl-ctrl-compass > span.zwgl-ctrl-compass-arrow。
    function compassBox() {
      const btn = document.querySelector("#map .zwgl-ctrl-compass");
      return btn ? (btn.closest(".zwgl-ctrl-group") || btn.parentElement) : null;
    }
    function updateCompassState() {
      const box = compassBox();
      if (!box) return;
      box.classList.add("hu-compass-box");                                   // 拡大・状態色の掴みどころ
      box.classList.toggle("hu-on", headingUpMode);                          // ON=シアン
      box.classList.toggle("hu-paused", headingUpMode && headingUpPaused);   // 手動ひねり中=半透明
      const btn = box.querySelector(".zwgl-ctrl-compass");
      if (!btn) return;
      btn.title = headingUpMode
        ? (headingUpPaused ? "進行方向↑：手動操作で一時解除中（📍で復帰／タップで北固定）" : "進行方向↑：ON（タップで北固定に戻す）")
        : "タップで進行方向を上にする（回転しているときは北へ戻す）";
      btn.setAttribute("aria-label", btn.title);
    }
    // 北を向いているか。浮動小数の誤差を許容する。
    function isHeadingNorth() {
      if (!map || typeof map.getHeading !== "function") return true;
      let h = 0;
      try { h = map.getHeading() || 0; } catch (e) { return true; }
      h = ((h % 360) + 360) % 360;
      return h < 0.5 || h > 359.5;
    }
    // 手動ひねりで一時解除。モード自体は保持し、📍かトグルで復帰する＝自動と手動を競合させない。
    function pauseHeadingUp() {
      if (!headingUpMode || headingUpPaused) return;
      headingUpPaused = true;
      updateCompassState();
      showToast("手動操作：自動回転を一時解除しました（📍で復帰）");
    }
    function resumeHeadingUp() {
      if (!headingUpMode || !headingUpPaused) return;
      headingUpPaused = false;
      updateCompassState();
      requestHeadingApply();
    }

    async function toggleHeadingUp() {
      if (headingUpMode) { setHeadingUp(false); return; }   // ON→OFF＝北固定へ戻す
      const ok = await ensureOrientationPermission();       // iOSはこのタップ起点でのみ通る
      if (!ok) {
        showToast("方位センサーの利用が許可されませんでした（北固定のまま使えます）", "warn");
        setHeadingUp(false);
        return;
      }
      setHeadingUp(true);
      showToast("進行方向↑：ON");
    }

    // 2本指のひねり（rotatable:true の副作用で効くジェスチャ）を検出して自動回転を一時解除する。
    // 既存の attachManualPanDetection は1本指限定なので役割が重ならない。
    function attachManualRotateDetection() {
      const el = document.getElementById("map");
      if (!el) return;
      let startAngle = null;
      const angleOf = t => Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX) * 180 / Math.PI;
      el.addEventListener("touchstart", e => {
        startAngle = (e.touches && e.touches.length === 2) ? angleOf(e.touches) : null;
      }, { capture: true, passive: true });
      el.addEventListener("touchmove", e => {
        if (startAngle == null || !e.touches || e.touches.length !== 2) return;
        let d = angleOf(e.touches) - startAngle;
        d = ((d + 180) % 360 + 360) % 360 - 180;              // -180〜180 に正規化
        if (Math.abs(d) > MANUAL_TWIST_DEG) pauseHeadingUp();  // ピンチズームだけなら角度は動かない
      }, { capture: true, passive: true });
      const clear = () => { startAngle = null; };
      el.addEventListener("touchend", clear, { capture: true, passive: true });
      el.addEventListener("touchcancel", clear, { capture: true, passive: true });
    }

    // 右上のZDCコンパスを「進行方向↑」のON/OFFトグルとして使う（⬆FABは廃止して集約）。
    // ZDC標準はコンパスの button 自身に click で setHeading(0)+setTilt(0) を持っている。
    // 祖先(#map)のキャプチャ段階で stopPropagation するとイベントが button へ到達しないので、
    // この組み込み挙動を抑止して自前の切替に置き換えられる（針の回転はZDC側がheading_changedで面倒を見る）。
    function attachCompassToggle() {
      const el = document.getElementById("map");
      if (!el) return;
      el.addEventListener("click", function(e) {
        const btn = (e.target && e.target.closest) ? e.target.closest(".zwgl-ctrl-compass") : null;
        if (!btn) return;
        e.stopPropagation();   // ZDC組み込みの setHeading(0)/setTilt(0) をここで止める
        e.preventDefault();
        if (headingUpMode) { setHeadingUp(false); return; }   // ON / 一時解除中 → OFF＋北へ
        // OFFのとき：手動ひねりで傾いていれば「北へ戻す」、既に北なら「ONにする」。
        // rotatable:true により進行方向↑とは無関係に2本指で回せてしまうため、
        // 「傾いた針をタップしたら北に戻る」という一般的なコンパスの直感を優先する。
        if (!isHeadingNorth()) { resetHeadingNorth(); return; }
        toggleHeadingUp();
      }, true);
      updateCompassState();   // 箱にクラスを付けて初期表示(OFF)を確定させる
    }

    // ===== 既定縮尺の保存UI（📍の長押し＝最小トリガー。専用の設定画面は作らない）=====
    // FABは既に4段積み（旧/▦/用/📍）なので5個目のボタンは足さず、📍の長押しに寄せる。
    let suppressLocateClick = false;   // 長押しでメニューを出した直後の click で locateMe() が走るのを防ぐ

    function openZoomMenu() {
      const el = document.getElementById("zoomMenu");
      if (!el || !map) return;
      const z = Math.round(map.getZoom());
      document.getElementById("zmSave").textContent  = "今の縮尺(Z" + z + ")を初期値として記憶";
      document.getElementById("zmReset").textContent = "既定に戻す(Z" + DEFAULT_ZOOM + ")";
      el.style.display = "block";
      // 長押しで指を離した瞬間のclickが、指の真下に出現したbackdropに落ちて即座に閉じるのを防ぐ。
      // 400msだけ backdrop を無反応にして合成clickを空振りさせる。
      const bd = el.querySelector(".zoom-menu-backdrop");
      if (bd) {
        bd.style.pointerEvents = "none";
        setTimeout(function() { bd.style.pointerEvents = "auto"; }, 400);
      }
    }
    window.closeZoomMenu = () => {
      const el = document.getElementById("zoomMenu");
      if (el) el.style.display = "none";
    };

    // 保存/適用はズーム整数で行う（ScaleBarのm表記には依存しない）。
    window.saveDefaultZoom = () => {
      closeZoomMenu();
      if (!map) return;
      const key = zoomKey();
      if (!key) { showToast("アカウント情報が取れず保存できませんでした", "error"); return; }
      const z = Math.round(map.getZoom());
      if (!Number.isFinite(z) || z < ZOOM_MIN || z > ZOOM_MAX) {
        showToast("縮尺を取得できませんでした", "error"); return;
      }
      try { localStorage.setItem(key, String(z)); }
      catch (e) { showToast("縮尺の保存に失敗しました", "error"); return; }
      showToast("この縮尺(Z" + z + ")を初期値として記憶しました");
    };
    window.resetDefaultZoom = () => {
      closeZoomMenu();
      const key = zoomKey();
      if (key) { try { localStorage.removeItem(key); } catch (e) { /* 使えない環境は既定値のまま動く */ } }
      showToast("初期縮尺を既定(Z" + DEFAULT_ZOOM + ")に戻しました");
    };

    // 📍を600ms長押しでメニュー。通常タップは従来どおり現在地へ寄せる。
    function attachLocateLongPress() {
      const b = document.querySelector(".locate-btn");
      if (!b) return;
      let timer = null;
      const start  = () => {
        clearTimeout(timer);
        timer = setTimeout(function() {
          suppressLocateClick = true;
          // clickが📍まで届かなかった場合（backdropに落ちた等）にフラグが残って
          // 次回の通常タップを1回食う事故を防ぐ自動解除。
          setTimeout(function() { suppressLocateClick = false; }, 700);
          openZoomMenu();
        }, 600);
      };
      const cancel = () => { clearTimeout(timer); timer = null; };
      b.addEventListener("touchstart",  start,  { passive: true });
      b.addEventListener("touchend",    cancel);
      b.addEventListener("touchcancel", cancel);
      b.addEventListener("touchmove",   cancel, { passive: true });
      b.addEventListener("mousedown",   start);
      b.addEventListener("mouseup",     cancel);
      b.addEventListener("mouseleave",  cancel);
      b.addEventListener("contextmenu", e => e.preventDefault());  // 長押し時の右クリック/選択メニューを抑止
    }

    // ===== LOCATE（📍：現在地へ寄せる＋追従ON復帰）=====
    window.locateMe = () => {
      if (suppressLocateClick) { suppressLocateClick = false; return; }  // 長押しでメニューを出した直後は無視
      setFollow(true);          // 追従ON復帰
      resumeHeadingUp();        // 手動ひねりで一時解除していた自動回転も併せて復帰
      startLocationWatch();     // 追跡が未開始/停止なら再開（watchIdで二重起動防止）
      if (!navigator.geolocation || !map) return;
      navigator.geolocation.getCurrentPosition(pos => {
        map.setCenter(new ZDC.LatLng(pos.coords.latitude, pos.coords.longitude));
        map.setZoom(getDefaultZoom());   // 起動時の初期表示と同一の縮尺（従来は17固定で起動時16とズレていた）
        showMyLocation(pos.coords.latitude, pos.coords.longitude);
      });
    };

    // ===== ENTER KEY LOGIN =====
    window.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.getElementById("loginScreen").style.display !== "none") {
        doLogin();
      }
    });
  </script>

    <div class="ml-text">現在地を取得中…</div>
  </div>
  <!-- 既定縮尺メニュー（📍長押しで表示） -->
  <div class="zoom-menu" id="zoomMenu">
    <div class="zoom-menu-backdrop" onclick="closeZoomMenu()"></div>
    <div class="zoom-menu-panel">
      <button id="zmSave" onclick="saveDefaultZoom()">今の縮尺を初期値として記憶</button>
      <button id="zmReset" onclick="resetDefaultZoom()">既定に戻す</button>
    </div>
  </div>
</div>

<div id="pinModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">ピンを追加</div>
    <div class="address-box" id="addressLabel">住所取得中…</div>
    <div class="field-label">地番（自動取得・表札を見て修正可）</div>
    <input id="chibanInput" type="text" placeholder="地番"
      style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;font-family:inherit;margin-bottom:4px;">
    <div id="chibanRefNote" style="display:none;color:#EF4444;font-size:12px;font-weight:600;margin-bottom:4px;">参考地番（近傍筆）・要確認</div>
    <div class="field-label">ステータス</div>
    <div id="statusGroups"></div>
    <div class="field-label">メモ</div>
    <textarea id="memo" placeholder="気づいたことを入力（任意）"></textarea>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
      <button id="saveBtn" onclick="savePin()">保存</button>
      <button id="deleteBtn" onclick="deletePin()" style="display:none">削除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  function updateOnlineStatus() {
    document.getElementById('offlineBadge').style.display = navigator.onLine ? 'none' : 'block';
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();
</script>

</body>
</html>
