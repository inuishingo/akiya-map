  <!-- ZENRIN Maps JavaScript API -->
  <!-- TODO: 本番移行時に本番キー(js-api 本番ドメイン)へ差し替え。現状は検証環境キー(test-js)。 -->
  <script src="https://test-js.zmaps-api.com/zma_loader.js?key=2xYL6LK8wxaJGUxZ8rwdD9rv4sHGXXX51pD8tLUW&auth=referer"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, getDoc, onSnapshot, updateDoc, deleteDoc, doc, setDoc, deleteField, serverTimestamp, runTransaction }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDloqlUX051jReuAW4_TyncQgGlk03CfO0",
      authDomain: "housemarket-map.firebaseapp.com",
      projectId: "housemarket-map",
      storageBucket: "housemarket-map.firebasestorage.app",
      messagingSenderId: "182625011825",
      appId: "1:182625011825:web:a5f7c989e94a426d5373d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ===== STATE =====
    let map = null;
    let mapInitStarted = false;  // initMapの二重起動ガード。mapへの代入まで最大5.5秒(初期測位待ち)空くためフラグで持つ
    let currentUser = null;
    let myBranch = "名古屋";   // ログイン調査員の所属店(displayNames[email].branch)。読取前は名古屋を既定に。
    let pinWidgetMap = new Map();
    let pinsUnsub = null;   // pins onSnapshot の解除関数（多重購読防止）
    let myLocationMarker = null; // 現在地（青ドット）。物件ピンとは別管理（listenPinsで消さない）
    let followMode = true;       // 追従モード（カーナビ式）。既定ON。手動パンでOFF、📍でON復帰
    let watchId = null;          // watchPosition のID（二重起動防止）
    // 進行方向↑（ヘディングアップ）。起動時は必ず北固定＝false。詳細は「進行方向↑」ブロック参照
    let headingUpMode = false;   // ユーザーの意思（トグルの状態）
    let headingUpPaused = false; // 手動ひねりによる一時解除。モードは保持したまま追従だけ止める
    let pendingLatLng = null;
    let pendingChiban = "";
    let pendingChibanRef = false;   // 直近の自動地番が「参考地番(近傍筆)・要確認」か
    let pendingAreaCode = null;     // 直近reverseのareaCode(JIS5桁)。ピン保存で使う（reverse失敗時null）
    let pendingAreaName = null;     // 直近reverseのareaName(市区町村名／政令市は区)。失敗時null
    // 保存する住所は「ラベルの表示文字列」ではなくこの変数から取る。ラベルは
    // "住所取得中…" / "住所不明" / "（オフライン）" を出すため、textContent をそのまま保存すると
    // UI文字列がDBに永続化される（実測63件）。null=reverse未完了 / ""=取得できなかった（空で保存）。
    let pendingAddress = null;
    let pendingReverse = null;      // 進行中のreverseのPromise。保存時に短時間だけ待つのに使う
    let offlineQueue = JSON.parse(localStorage.getItem("offlineQueue") || "[]");
    // Undo：このセッションで自分が立てたピンだけを積む（過去セッション・他人のピンは入れない＝絶対に消えない）。
    // ログアウトで捨てる。詳細は「UNDO」ブロック参照。
    let undoStack = [];
    const UNDO_MAX = 50;   // 際限なく溜めない（現場の1日ぶんには十分）
    let editingPinId = null;
    let editingPinData = null;

    // ===== 調査グリッド(MVP) 状態 =====
    // 既存のピン機能には非干渉。初期OFFで、ONの間だけマスタップを有効化する。
    let gridMode = false;             // 調査グリッド記録モード（初期OFF＝従来のピン追加のまま）
    let youtoOn = false;              // 用途地域重畳モード（初期OFF）。ON中はクリック＝属性取得でピン追加停止
    let lastPinDocs = [];             // 直近の pins スナップショット（重畳後にマーカーを最前面へ積み直す用）
    let gridWidgets = [];             // グリッド線＋塗りのZDCウィジェット（markersとは別管理）
    let surveyedCells = {};           // gridId -> Firestoreミラー（調査済みマス）
    const gridToggleLock = new Set(); // 同一マスの二重トグル防止（map/polygon両クリック対策）

    // 全12種。グループ（建物系→土地系→NG系）順。色は確定値。
    // ※他社所有/媒介は「状態」でなく属性のため STATUS ではなく pin.otherCompany(boolean) で持つ。
    // color は地図ピンの色分けに使用（削除しない）。emoji はモーダルのボタン表示用。
    const STATUS = {
      // 建物系
      akiya:   { label: "空家",   color: "#3B82F6", text: "#fff", emoji: "🏚️" },
      chikuko: { label: "築古",   color: "#6366F1", text: "#fff", emoji: "🧱" },
      haikyo:  { label: "廃墟",   color: "#A855F7", text: "#fff", emoji: "🕸️" },
      renpei:  { label: "連棟",   color: "#8B5CF6", text: "#fff", emoji: "🏘️" },
      shueki:  { label: "収益",   color: "#0EA5E9", text: "#fff", emoji: "💰" },
      souko:   { label: "倉庫",   color: "#64748B", text: "#fff", emoji: "📦" },
      // 土地系
      sarachi: { label: "更地",   color: "#10B981", text: "#fff", emoji: "🟩" },
      zasshu:  { label: "雑種地", color: "#84CC16", text: "#fff", emoji: "🌿" },
      parking: { label: "駐車場", color: "#14B8A6", text: "#fff", emoji: "🅿️" },
      tahata:  { label: "田・畑", color: "#65A30D", text: "#fff", emoji: "🌾" },
      // NG系（反社/NG=永久ピン）
      hansha:  { label: "反社", color: "#1F2937", text: "#fff", emoji: "🚨" },
      ng:      { label: "NG",   color: "#6B7280", text: "#fff", emoji: "⛔" },
    };
    const STATUS_GROUPS = [
      { label: "建物系", keys: ["akiya", "chikuko", "haikyo", "renpei", "shueki", "souko"] },
      { label: "土地系", keys: ["sarachi", "zasshu", "parking", "tahata"] },
      { label: "NG系", keys: ["hansha", "ng"] },
    ];
    // 除外候補用ステータス（EXCLUDE_STATUS）。通常STATUSと衝突しないキーを利用（ex_接頭辞）。
    const EXCLUDE_STATUS = {
      // 建物系の除外セット
      ex_new:   { label: "新築中", color: "#FACC15", text: "新", group: "building" },
      ex_demo:  { label: "解体中", color: "#FACC15", text: "解", group: "building" },
      ex_live:  { label: "居住中", color: "#FACC15", text: "居", group: "building" },
      ex_kouhogai_tate:   { label: "候補外(建物)", color: "#FACC15", text: "外", group: "building" },
      // 土地系の除外セット
      ex_sale:  { label: "分譲中", color: "#FACC15", text: "分", group: "land" },
      ex_fill:  { label: "造成中", color: "#FACC15", text: "造", group: "land" },
      ex_parking:{ label: "駐車場", color: "#FACC15", text: "P", group: "land" },
      ex_kouhogai_tochi: { label: "候補外(土地)", color: "#FACC15", text: "外", group: "land" },
    };
    const EXCLUDE_STATUS_GROUPS = [
      { label: "建物系（除外）", keys: ["ex_new","ex_demo","ex_live","ex_kouhogai_tate"] },
      { label: "土地系（除外）", keys: ["ex_sale","ex_fill","ex_parking","ex_kouhogai_tochi"] },
    ];
    // 未定義ステータス（旧データ等）のフォールバック色
    const FALLBACK_COLOR = "#9CA3AF";
    // 除外描画色・ラベル枠
    const EXCLUDE_COLOR = "#FACC15";
    const EXCLUDE_BORDER = "#78350F";
    let excludeCandidateMode = false; // UI表示モード（モーダル内のステータス群を切替）

    // ===== 担当者カラー（#001ラベル背景） =====
    // 担当者色は displayNames レジストリの order（0始まりの固定index）で決まる（admin.html と同一方式）。
    // 並び順・在席に依存しないので各人の色は不変。order を持つ doc だけが色付け対象（＝調査員）。
    // order 無し/範囲外/未登録（事務員等）は STAFF_DEFAULT_COLOR。既存6色は順序ごと固定・末尾4色は7〜10人目用。
    const STAFF_PALETTE = ["#2563EB","#0891B2","#059669","#D97706","#7C3AED","#DB2777","#4D7C0F","#A21CAF","#B45309","#475569"];
    const STAFF_DEFAULT_COLOR = "#65A30D";
    let staffColorMap = {};
    async function buildStaffColors() {
      staffColorMap = {};
      try {
        const snap = await getDocs(collection(db, "displayNames"));
        snap.forEach(d => {
          const o = d.data().order;   // 0始まりの固定index（number型）。無ければ色対象外
          if (Number.isInteger(o) && o >= 0 && o < STAFF_PALETTE.length) {
            staffColorMap[d.id] = STAFF_PALETTE[o];   // d.id = メールアドレス
          }
        });
      } catch (e) {
        // displayNames 読取NG時は全員 STAFF_DEFAULT_COLOR にフォールバック
      }
    }
    function staffColor(email) {
      return staffColorMap[email] || STAFF_DEFAULT_COLOR;
    }

    // ===== 調査周回（round）— C-1 基盤 =====
    // 周回はエリア（市区町村）ごとに独立管理。areaKey は pins.areaCode(JIS5桁)を使う（旧cityWardKey正規表現は不使用）。
    function areaKey(p){ return (p && p.areaCode) || null; }
    let roundState = {};      // `${branch}__${areaKey}` -> {currentRound, rounds}
    let roundsUnsub = null;   // survey_rounds 購読の解除関数（多重購読防止）
    // survey_rounds を購読。現在周回の変化で色/薄色が変わるため再描画。マスタ無エリアは currentRound=1 扱い。
    function listenRounds(){
      if (roundsUnsub) roundsUnsub();
      roundsUnsub = onSnapshot(collection(db, "survey_rounds"), snap => {
        roundState = {}; snap.forEach(d => roundState[d.id] = d.data());
        if (map) renderAllMarkers();
      }, e => {});
    }
    // 0 は正当な周回番号（第0周＝冊子リスト由来の未調査ピン）。|| だと 0 が 1 に化けて
    // 全件が1周目扱いになるため ?? を使う。ただし Number(undefined) は NaN で ?? に拾われないので、
    // Number(x ?? 1) の順序（?? を内側）でなければならない。Number(undefined) ?? 1 は NaN のまま。
    function currentRoundOf(p){ const s = roundState[`${pinBranch(p)}__${areaKey(p)}`]; return Number(s?.currentRound ?? 1); }
    function roundOf(p){ return Number(p.surveyRound ?? 1); }
    function isPastRound(p){ return !isPermanentPin(p) && roundOf(p) < currentRoundOf(p); }   // 過去周回の通常ピン=薄色対象
    // ラベル背景色（index/admin統一）：要確認赤 ＞ 永久黒 ＞ 周回色（1青/2緑/3橙/4紫→((r-1)%4)ローテ）。担当者色は廃止。
    const ROUND_COLORS = ["#2563EB","#16A34A","#EA580C","#9333EA"];
    // 第0周（冊子リスト）は周回ローテとは別系統のグレー。((0-1)%4) だと第4周の紫と衝突するため専用色にする。
    // isPastRound=true で薄色化が乗るため、薄いグレーだと地図上で消える。輪郭が残る濃さを選ぶこと。
    const ROUND0_COLOR = "#64748B";
    function roundColor(r){ return (Number(r) === 0) ? ROUND0_COLOR : ROUND_COLORS[(((r ?? 1)-1)%4+4)%4]; }
    function labelColor(p){
      if (isReviewFlagged(p)) return "#EF4444";
      if (isPermanentPin(p))  return PERMANENT_COLOR;
      return roundColor(roundOf(p));
    }

    // ===== 要確認(赤)判定 — 単一真実。admin.html と同一定義（色基準を統一）=====
    // 赤＝住所が要確認 or 地番が未取得。admin で住所/地番を手補正すると onSnapshot 経由で
    // この計算値が変わり、調査員側のピン色も通常色へ自動追従する。
    function isAddrUnknown(p) {
      const a = (p.address || "").trim();
      return !a || a === "住所不明" || a === "（オフライン）" || a === "取得中…" || a === "住所取得中…";
    }
    // 永久ピン（反社/NG）：周回・日付フィルタ例外／削除不可／専用色。status キーで判定。
    const PERMANENT_COLOR = "#374151";
    function isPermanentPin(p) { return p.status === "hansha" || p.status === "ng"; }
    function isChibanMissing(p) {
      if (isPermanentPin(p)) return false;   // 反社/NGは地番レビュー対象外＝地番未取得でも赤にしない
      return !(p.chiban && String(p.chiban).trim());
    }
    function needsReviewNow(p) {
      return isAddrUnknown(p) || isChibanMissing(p);
    }
    // 表示専用: 計算上の要確認(住所不明/地番未取得)に加え、保存済 needsReview(参考地番等)も赤に。
    // ※再計算・書き戻し(手補正)は needsReviewNow のまま。表示・フィルタだけがこの拡張を使う。
    function isReviewFlagged(p) {
      return needsReviewNow(p) || p.needsReview === true;
    }

    // ===== 市区「続きへ」ジャンプ =====
    // 市区プレフィックスを除いた住所末尾（町名+番地）。一覧の3列目に表示。
    function addrTail(address, key) {
      let a = (address || "").normalize("NFKC").trim();
      a = a.replace(/^(東京都|北海道|京都府|大阪府|.{2,3}県)/, "");
      a = a.replace(/^.{1,4}郡/, "");
      if (key && a.startsWith(key)) a = a.slice(key.length);
      return a.trim();
    }
    // createdAt(ISO/UTC) を JST(+9h) の M/D に。
    function jstMD(iso) {
      const t = Date.parse(iso || "");
      if (Number.isNaN(t)) return "";
      const d = new Date(t + 9 * 3600 * 1000);
      return (d.getUTCMonth() + 1) + "/" + d.getUTCDate();
    }
    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 市区ごとに「最終ピン(createdAt最大)」を1件保持し、最終ピンの新しい順に並べる。
    function buildJumpList() {
      const byKey = {};   // key -> { id, t, lat, lng, address, createdAt }
      lastPinDocs.forEach(({ id, data }) => {
        if (pinBranch(data) !== myBranch) return;   // 「続きへ」は自店の履歴だけ（地図のピン表示は全店共有のまま）
        if (data.lat == null || data.lng == null) return;   // ジャンプ先が定まらない
        const key = data.areaCode;   // areaCode(JIS5桁)で市区をまとめる（旧cityWardKey廃止）
        if (!key) return;
        const t = Date.parse(data.createdAt || "") || 0;
        if (!byKey[key] || t > byKey[key].t) {
          byKey[key] = { id, t, lat: data.lat, lng: data.lng, address: data.address, createdAt: data.createdAt, areaName: data.areaName || "" };
        }
      });
      return Object.entries(byKey)
        .map(([key, v]) => ({ key, ...v }))
        .sort((a, b) => b.t - a.t);   // 直近に回った市区が上
    }

    // ドロップダウンを再構築（ピン更新のたび呼ぶ）。選択値は毎回ラベルへ戻す。
    function renderJumpList() {
      const sel = document.getElementById("jumpSelect");
      if (!sel) return;
      const list = buildJumpList();
      const opts = ['<option value="">📍 続きへ ▼</option>'];
      list.forEach(item => {
        // 表示順：日付（M/D・左端固定）　市区名　住所末尾。日付先頭で桁ズレを解消。
        const text = `${jstMD(item.createdAt)}　${item.areaName}　${addrTail(item.address, item.areaName)}`;
        opts.push(`<option value="${item.id}">${escHtml(text)}</option>`);
      });
      sel.innerHTML = opts.join("");
      sel.value = "";
    }

    // 選択した市区の最終ピン（＝続きの起点）へ移動。追従はOFFにして現在地に引き戻されないようにする。
    window.jumpToCity = (id) => {
      const sel = document.getElementById("jumpSelect");
      if (sel) sel.value = "";   // 同じ市区を続けて選べるようラベルへ戻す
      if (!id || !map) return;
      const doc = lastPinDocs.find(d => d.id === id);
      if (!doc) return;
      setFollow(false);
      map.setCenter(new ZDC.LatLng(doc.data.lat, doc.data.lng));
      map.setZoom(17);   // エリア把握しやすい倍率
    };

    // メール→表示名マップ。displayNames コレクション（doc ID=メール, field name）を全件読む。
    // 未登録メールはメールのままフォールバック（落とさない）。手動でdoc追加すれば即反映。
    let staffNameMap = {};
    async function buildStaffNames() {
      staffNameMap = {};
      try {
        const snap = await getDocs(collection(db, "displayNames"));
        snap.forEach(d => {
          const n = d.data().name;
          if (n) staffNameMap[d.id] = n;   // d.id = メールアドレス
        });
      } catch(e) {}
    }
    function staffName(email) {
      return staffNameMap[email] || email || "–";
    }
    // ===== 店舗判定（メールルールに一本化）=====
    // scope=見えるピン範囲・branch=新規ピンの所属。「kyoto含む→京都／@housemarket.com(kyoto無)→全店／それ以外→名古屋」。
    function branchOfEmail(email){
      return String(email||"").toLowerCase().includes("kyoto") ? "京都" : "名古屋";
    }
    function isAllStore(email){
      const e = String(email||"").toLowerCase();
      return !e.includes("kyoto") && e.endsWith("@housemarket.com");
    }
    // ログイン者の所属店（新規ピン/グリッドのbranchに使う）。メールで決定＝全店アカウントは名古屋拠点扱い。
    async function loadMyBranch(email) {
      myBranch = branchOfEmail(email);
    }
    // ピンの所属店。branch空/欠落は "名古屋" とみなす（admin.html と同一判定）。
    function pinBranch(p) {
      return (p.branch && String(p.branch).trim()) ? p.branch : "名古屋";
    }

    // ===== ステータス選択UI（グループ見出し付き2列グリッド）=====
    // 他社物件チェックは「状態と独立の属性」。土地系とNG系の間（＝反社/NGを含むグループの直前）に挟む。
    function renderStatusOptions() {
      // 上部に常時表示するトグル群（他社物件・除外候補）。除外モード時は他社チェックを隠す。
      const controlsHtml = `
        <div style="margin-bottom:8px;display:flex;gap:8px;align-items:center;">
          <label class="oc-check" id="otherCompanyWrapper" style="${excludeCandidateMode ? 'display:none' : ''}">
            <input type="checkbox" id="otherCompanyCheck"><span>🏢 他社物件</span>
          </label>
          <label class="oc-check" id="excludeWrapper">
            <input type="checkbox" id="excludeCandidateCheck"><span>🚫 除外候補</span>
          </label>
        </div>`;

      const groups = (excludeCandidateMode ? EXCLUDE_STATUS_GROUPS : STATUS_GROUPS).map(g => {
        const groupHtml = `
        <div class="status-group-label">${g.label}</div>
        <div class="status-grid">
          ${g.keys.map(k => {
            const s = excludeCandidateMode ? EXCLUDE_STATUS[k] : STATUS[k];
            const color = s ? s.color : FALLBACK_COLOR;
            const emoji = s && s.emoji ? s.emoji : "";
            return `<div><input class="status-option" type="radio" name="status" id="s-${k}" value="${k}">
              <label class="status-label" for="s-${k}" style="--c:${color}"><span class="emoji">${emoji}</span>${s ? s.label : k}</label></div>`;
          }).join("")}
        </div>`;
        return groupHtml;
      }).join("");

      document.getElementById("statusGroups").innerHTML = controlsHtml + groups;

      // checkbox バインド（切替時は選択中のstatusが新セットに存在するかを保持する）
      const prevSelected = document.querySelector('input[name="status"]:checked')?.value;
      const excl = document.getElementById("excludeCandidateCheck");
      if (excl) {
        excl.checked = excludeCandidateMode;
        excl.addEventListener("change", (e) => {
          const prev = document.querySelector('input[name="status"]:checked')?.value;
          const prevOther = document.getElementById('otherCompanyCheck') ? document.getElementById('otherCompanyCheck').checked : false;
          excludeCandidateMode = !!e.target.checked;
          renderStatusOptions();
          // 再描画後に前回選択が新セットに残っているなら維持、なければ未選択にする
          if (prev) {
            const keep = document.querySelector('input[name="status"][value="' + prev + '"]');
            if (keep) keep.checked = true; else {
              const cur = document.querySelector('input[name="status"]:checked'); if (cur) cur.checked = false;
            }
          }
          // 他社チェックの状態を復元（表示される場合のみ）
          const other = document.getElementById('otherCompanyCheck'); if (other) other.checked = !!prevOther;
        });
      }
      const otherCmp = document.getElementById("otherCompanyCheck");
      if (otherCmp) {
        otherCmp.checked = false;
      }
      // 初回レンダー時は前回の選択を復元（ある場合のみ）
      if (prevSelected) {
        const el = document.querySelector('input[name="status"][value="' + prevSelected + '"]');
        if (el) el.checked = true;
      }
    }
    function setStatusRadio(key) {
      const el = document.getElementById("s-" + key);
      if (el) { el.checked = true; return; }
      // 未定義キー（旧データ編集時など）は未選択にして再選択を促す
      const cur = document.querySelector('input[name="status"]:checked');
      if (cur) cur.checked = false;
    }
    renderStatusOptions();

    // ===== OFFLINE SYNC =====
    async function syncOfflineQueue() {
      if (!navigator.onLine || offlineQueue.length === 0) return;
      const remaining = [];
      for (const item of offlineQueue) {
        try {
          // オフライン中に採番できなかったピンは同期時に採番（既に番号があれば維持）。
          if (item.seqNo == null) item.seqNo = await nextSeqNo();
          const ref = await addDoc(collection(db, "pins"), item);
          undoUpgradeQueued(item, ref.id);   // 同期でIDが確定＝Undo対象を doc に昇格（同期後もUndoできる）
        } catch(e) {
          remaining.push(item);
        }
      }
      offlineQueue = remaining;
      localStorage.setItem("offlineQueue", JSON.stringify(offlineQueue));
      if (remaining.length === 0) showToast("オフライン中のデータを同期しました");
    }
    window.addEventListener("online", syncOfflineQueue);

    // ===== AUTH =====
    onAuthStateChanged(auth, async user => {
      currentUser = user;
      if (user) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mapScreen").style.display = "flex";
        document.getElementById("userLabel").textContent = user.email;
        await loadMyBranch(user.email);   // 自店を確定してからピン/グリッド作成に入る（branch に使う）
        // 担当者カラー/表示名は displayNames の全件読み。ログイン時に1回だけ読む
        // （以前は pins の onSnapshot ごとに読んでおり、ピン1件の追加/編集でも毎回 getDocs が走っていた）。
        await Promise.all([buildStaffColors(), buildStaffNames()]);
        initMap();
        // 再ログイン時は initMap が早期returnするため、map既存ならここで購読を張り直す
        // （初回ログインは map 生成後の ready コールバック内で listenPins する）
        if (map) listenPins();
        listenRounds();   // 周回マスタを購読（現在周回で色/薄色を判定）
        syncOfflineQueue();
      } else {
        // ログアウト：購読解除＋マーカー消去（再ログイン時の多重購読・残像を防ぐ）
        if (pinsUnsub) { pinsUnsub(); pinsUnsub = null; }
        if (roundsUnsub) { roundsUnsub(); roundsUnsub = null; }
        if (map) {
          for (const id of Array.from(pinWidgetMap.keys())) {
            removePinMarker(id);
          }
        }
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("mapScreen").style.display = "none";
      }
    });

    window.doLogin = async () => {
      const email = document.getElementById("email").value.trim();
      const pass  = document.getElementById("pass").value;
      const btn   = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "ログイン中…";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(e) {
        showToast("メールアドレスまたはパスワードが違います", "error");
        btn.disabled = false;
        btn.textContent = "ログイン";
      }
    };

    window.doLogout = async () => {
      // 共有タブレットで担当が入れ替わったとき、前の担当者のピンがUndo対象に残らないよう捨てる。
      undoStack = [];
      updateUndoBtn();
      await signOut(auth);
    };

    // ===== 調査グリッド(survey grid) MVP =====
    // 既存のピン機能とは非干渉。gridMode(初期OFF)中のみ map クリックでマスをトグルする。
    // 250m固定グリッド。原点(南西)から機械的に敷く。経度は固定の基準緯度cosで換算。
    // 将来ZENRINのページ図郭へ差し替える前提で、原点/サイズは gridVersion で版管理する。
    const GRID = { lat0: 35.00, lng0: 136.80, refLat: 35.2, sizeM: 250, version: "v1-250m" };
    const GRID_DLAT = GRID.sizeM / 111000;                                           // 緯度1マス(°)
    const GRID_DLNG = GRID.sizeM / (111000 * Math.cos(GRID.refLat * Math.PI / 180)); // 経度1マス(°)

    function gridCellOf(lat, lng) {
      const row = Math.floor((lat - GRID.lat0) / GRID_DLAT);
      const col = Math.floor((lng - GRID.lng0) / GRID_DLNG);
      return { row, col, id: "G_" + row + "_" + col };
    }
    function gridCellCorners(row, col) {
      const s = GRID.lat0 + row * GRID_DLAT, n = GRID.lat0 + (row + 1) * GRID_DLAT;
      const w = GRID.lng0 + col * GRID_DLNG, e = GRID.lng0 + (col + 1) * GRID_DLNG;
      return [ new ZDC.LatLng(s, w), new ZDC.LatLng(n, w), new ZDC.LatLng(n, e), new ZDC.LatLng(s, e) ];
    }
    function gridCellCenter(row, col) {
      return { lat: GRID.lat0 + (row + 0.5) * GRID_DLAT, lng: GRID.lng0 + (col + 0.5) * GRID_DLNG };
    }

    // 調査済みマスを全件読み込み（リロード復元＆他調査員の済みマス共有）。
    async function loadSurveyGrids() {
      try {
        const snap = await getDocs(collection(db, "survey_grids"));
        surveyedCells = {};
        snap.forEach(d => { surveyedCells[d.id] = d.data(); });
        if (gridMode) redrawGrid();
      } catch (e) { /* オフライン等は無視（再オンライン/再ログインで再取得） */ }
    }

    function clearGridWidgets() {
      gridWidgets.forEach(w => { try { map.removeWidget(w); } catch (e) {} });
      gridWidgets = [];
    }

    // 可視範囲のグリッド線＋（調査済み）塗りを描画。地図移動(idle)ごとに呼ぶ。
    function redrawGrid() {
      if (!map) return;
      clearGridWidgets();
      if (!gridMode) return;
      const b = map.getLatLngBounds();
      let sw = b.getSouthWest(), ne = b.getNorthEast();
      // 回転中は getLatLngBounds が heading 非考慮の軸並行矩形を返し、画面四隅がその外へはみ出す。
      // はみ出すぶんだけ広げてから行列を求める（heading=0 のときは加算0＝従来と完全に同じ）。
      const gpad = rotationBufferRatio();
      if (gpad > 0) {
        const gLat = (ne.lat - sw.lat) * gpad, gLng = (ne.lng - sw.lng) * gpad;
        sw = new ZDC.LatLng(sw.lat - gLat, sw.lng - gLng);
        ne = new ZDC.LatLng(ne.lat + gLat, ne.lng + gLng);
      }
      const rMin = Math.floor((sw.lat - GRID.lat0) / GRID_DLAT);
      const rMax = Math.floor((ne.lat - GRID.lat0) / GRID_DLAT);
      const cMin = Math.floor((sw.lng - GRID.lng0) / GRID_DLNG);
      const cMax = Math.floor((ne.lng - GRID.lng0) / GRID_DLNG);
      // 罫線は枠が多すぎる(ズームアウトしすぎ)場合は描かない＝現場端末の負荷保護。
      // 塗りは調査済みマスのみ(少数)なので常時描く。
      if ((rMax - rMin) <= 60 && (cMax - cMin) <= 60) {
        for (let r = rMin; r <= rMax + 1; r++) {
          const lat = GRID.lat0 + r * GRID_DLAT;
          const ln = new ZDC.Polyline(
            [ new ZDC.LatLng(lat, GRID.lng0 + cMin * GRID_DLNG), new ZDC.LatLng(lat, GRID.lng0 + (cMax + 1) * GRID_DLNG) ],
            { color: "#1D4ED8", width: 1, opacity: 0.25 }
          );
          map.addWidget(ln); gridWidgets.push(ln);
        }
        for (let c = cMin; c <= cMax + 1; c++) {
          const lng = GRID.lng0 + c * GRID_DLNG;
          const ln = new ZDC.Polyline(
            [ new ZDC.LatLng(GRID.lat0 + rMin * GRID_DLAT, lng), new ZDC.LatLng(GRID.lat0 + (rMax + 1) * GRID_DLAT, lng) ],
            { color: "#1D4ED8", width: 1, opacity: 0.25 }
          );
          map.addWidget(ln); gridWidgets.push(ln);
        }
      }
      Object.values(surveyedCells).forEach(cell => {
        if (cell.row == null || cell.col == null) return;
        if (cell.row < rMin - 1 || cell.row > rMax + 1 || cell.col < cMin - 1 || cell.col > cMax + 1) return;
        const fillCol = staffColor(cell.surveyedBy);   // 担当者色（null/未登録はdefaultにフォールバック）
        const poly = new ZDC.Polygon(
          gridCellCorners(cell.row, cell.col),
          { fill: fillCol, fillOpacity: 0.30, stroke: fillCol, strokeWidth: 1 }
        );
        // 塗り済みマスのタップでも解除できるよう、polygon自身にもclickを付ける（mapクリックと二重発火はlockで吸収）。
        poly.addEventListener("click", () => {
          const c = gridCellCenter(cell.row, cell.col);
          toggleGridCell(c.lat, c.lng);
        });
        map.addWidget(poly); gridWidgets.push(poly);
      });
    }

    // マスを調査済み/解除でトグル。doc ID = gridId で set/delete（重複しない）。
    async function toggleGridCell(lat, lng) {
      if (!currentUser) return;
      const cell = gridCellOf(lat, lng);
      if (gridToggleLock.has(cell.id)) return;        // 同一タップの二重処理防止
      gridToggleLock.add(cell.id);
      setTimeout(() => gridToggleLock.delete(cell.id), 350);
      const ref = doc(db, "survey_grids", cell.id);
      if (surveyedCells[cell.id]) {
        const prev = surveyedCells[cell.id];          // 楽観更新→失敗時に戻す
        delete surveyedCells[cell.id];
        redrawGrid();
        try { await deleteDoc(ref); showToast("調査済みを解除：" + cell.id); }
        catch (e) { surveyedCells[cell.id] = prev; redrawGrid(); showToast("解除の保存に失敗しました", "error"); }
      } else {
        const data = {
          gridId: cell.id, row: cell.row, col: cell.col,
          surveyedDate: new Date().toISOString().slice(0, 10), // 調査日
          surveyedBy: currentUser.email || "",                  // 調査担当者
          recordedAt: new Date().toISOString(),                 // 記録日時
          branch: myBranch,                                     // ログイン調査員の所属店（loadMyBranchで確定）
          gridVersion: GRID.version,
        };
        surveyedCells[cell.id] = data;
        redrawGrid();
        try { await setDoc(ref, data); showToast("調査済みに記録：" + cell.id); }
        catch (e) { delete surveyedCells[cell.id]; redrawGrid(); showToast("記録の保存に失敗しました", "error"); }
      }
    }

    // 記録モードのON/OFF。ボタン色＋上部バナーで状態を明示（ONのままピン追加できない事故を防ぐ）。
    window.toggleGridMode = () => {
      gridMode = !gridMode;
      const btn = document.getElementById("gridBtn");
      const banner = document.getElementById("gridBanner");
      if (btn) btn.classList.toggle("active", gridMode);
      if (banner) banner.style.display = gridMode ? "block" : "none";
      redrawGrid();
      showToast(gridMode ? "調査グリッド：ON（マスをタップで記録）" : "調査グリッド：OFF（通常のピン追加に戻りました）",
                gridMode ? "warn" : "ok");
      updateYoutoBanner(); // gridMode ON 中は用途地域バナーを出さない（二重防止）
    };

    // ===== 既定ズーム（縮尺）=====
    // ZDCのズームは離散整数（1段＝縮尺2倍）。ScaleBar基準で 17≒100m / 16≒200m / 15≒400m。
    // 旧コードは「初期描画=15 / 起動時の現在地遷移=16 / 📍現在地ボタン=17」とバラついていた（実質バグ）。
    // 起動時も📍も getDefaultZoom() の1本だけを見る。保存があればそれ、無ければ DEFAULT_ZOOM。
    const DEFAULT_ZOOM = 18;                          // 既定＝50m相当（現場調査の実用縮尺）
    const ZOOM_KEY_PREFIX = "akiyamap_default_zoom_"; // 実キーは この接頭辞＋uid（下記 zoomKey）
    const ZOOM_MIN  = 4, ZOOM_MAX = 22;               // 壊れた保存値・範囲外を弾く健全性ガード
    // 拠点駅フォールバック時だけは従来どおり15（≒400m）。駅を50m相当で出しても駅前しか見えず使えないため、
    // 「現在地の縮尺」とは別物として扱う（統一の対象は起動時の現在地表示と📍ボタンの2つ）。
    const HOME_ZOOM = 15;

    // 既定縮尺はアカウント別に持つ（共有タブレットで営業が入れ替わっても縮尺が混ざらない）。
    // 保存先は端末のlocalStorageのまま＝端末間の同期はしない。uidが取れない異常時は null を返し、
    // 呼び出し側が DEFAULT_ZOOM にフォールバックする。
    function zoomKey() {
      const uid = (auth && auth.currentUser && auth.currentUser.uid)
        || (currentUser && currentUser.uid) || null;
      return uid ? (ZOOM_KEY_PREFIX + uid) : null;
    }

    // 保存値が無い/壊れている/uidが取れない/localStorageが使えない(プライベートモード等)場合は
    // 必ず DEFAULT_ZOOM に落ちる。
    function getDefaultZoom() {
      const key = zoomKey();
      if (!key) return DEFAULT_ZOOM;
      let raw = null;
      try { raw = localStorage.getItem(key); } catch (e) { return DEFAULT_ZOOM; }
      const z = parseInt(raw, 10);
      return (Number.isInteger(z) && z >= ZOOM_MIN && z <= ZOOM_MAX) ? z : DEFAULT_ZOOM;
    }

    // ===== MAP INIT =====
    // 【2026-08 現在地優先の初期化】
    //   旧: 拠点駅中心で ZDC.Map を同期生成 → 測位が返ってから setCenter+setZoom。
    //       測位は enableHighAccuracy/timeout:8000 なので、駅の画面が「一瞬」ではなく
    //       測位が返るまでの実時間ずっと見えていた（fly/アニメーションではなく生成順の問題）。
    //   新: 測位と ZMALoader のロードを並行で走らせ、測位が確定してから ZDC.Map を生成する。
    //       ＝拠点駅中心のフレームを一度も作らないので、視覚的な遷移そのものが起きない。
    //       測位中はローディングで覆う（従来も同じ時間ぶん駅が映っていただけで、待ち時間は増えない）。
    // 初期測位はローディングで画面を止めるので、旧8000msでは待たせすぎる。5000msで打ち切って拠点駅へ。
    // （継続追跡の watchPosition は画面を止めないので8000msのまま）
    const GEO_TIMEOUT_MS   = 5000;   // 初期測位の打ち切り
    const GEO_MAX_ACCURACY = 1000;   // これより粗い測位は信用しない（従来ガードを踏襲）

    // PCは位置推定が粗く岡崎等にズレるため測位に行かない（従来方針）。判定を1箇所に集約。
    function isMobileUA() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || (window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
    }

    // 初期表示に使う現在地を1回だけ取る。成功なら {lat,lng}、それ以外は null。
    // 【重要】必ず解決する。ブラウザが getCurrentPosition のコールバックを返さない実装
    // （一部のAndroid WebView）でも setTimeout の保険で null に落ちる。これが無いとローディングが永久に残る。
    function getInitialFix() {
      return new Promise(function(resolve) {
        if (!isMobileUA() || !navigator.geolocation) { resolve(null); return; }
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        setTimeout(function() { finish(null); }, GEO_TIMEOUT_MS + 500);
        navigator.geolocation.getCurrentPosition(
          pos => finish(pos.coords.accuracy > GEO_MAX_ACCURACY
            ? null                                                       // 粗すぎる測位は使わず拠点駅へ
            : { lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => finish(null),                                            // 失敗・拒否・タイムアウト
          { enableHighAccuracy: true, timeout: GEO_TIMEOUT_MS, maximumAge: 60000 }
        );
      });
    }

    function showMapLoading(on) {
      const el = document.getElementById("mapLoading");
      if (el) el.style.display = on ? "flex" : "none";
    }

    function initMap() {
      if (mapInitStarted) return;   // map代入まで最大5.5秒空くので map ではなく開始フラグで二重起動を防ぐ
      mapInitStarted = true;
      // ローディングはモバイルだけ。PCは測位に行かない＝待ち時間ゼロで拠点駅を即表示するので、
      // スピナーを挟むとかえって遅く見える。
      if (isMobileUA() && navigator.geolocation) showMapLoading(true);

      const fixPromise = getInitialFix();   // ZMALoaderのロードと並行で測位を開始（直列にしない）

      ZMALoader.setOnLoad(function(mapOptions, error) {
        if (error) {
          showMapLoading(false);
          mapInitStarted = false;           // 再ログイン等でやり直せるように戻す
          showToast("地図の読み込みに失敗しました", "error");
          return;
        }

        fixPromise.then(function(fix) {
          // 現在地が取れたらそこを中心に。取れない時だけ拠点駅にフォールバック。
          // 京都=京都駅／名古屋・全店=名古屋駅。myBranchはloadMyBranchで確定済み。
          const HOME_CENTER = { "京都": new ZDC.LatLng(34.9859, 135.7585) };   // 京都駅
          mapOptions.center = fix
            ? new ZDC.LatLng(fix.lat, fix.lng)
            : (HOME_CENTER[myBranch] || new ZDC.LatLng(35.170, 136.882));      // 既定=名古屋駅
          // 現在地スタート＝📍ボタンと同一の縮尺（不整合の解消）／駅フォールバック＝従来の広域
          mapOptions.zoom = fix ? getDefaultZoom() : HOME_ZOOM;
          mapOptions.movable = true;
          mapOptions.zoomable = true;
          mapOptions.touchOperation = true;
          mapOptions.mouseOperation = true;
          // 進行方向↑（自動回転）に必須。ZDCは setHeading() を this._options.rotatable で守っており、
          // これが無いと例外も出さず黙って無視される（＝回らない原因が分からなくなる既知の落とし穴）。
          // tilt/tiltable は入れない＝2Dの方位回転のみで、3D傾きは使わない。
          mapOptions.rotatable = true;
          // 下地を常時「標準住宅地図デザイン」に（表札＋住居表示。大縮尺=ズームインで視認）。
          // TODO: 本番キーでは契約発行の住宅地図デザインIDへ差し替え（検証環境は Ai3Y2Jwp）。
          mapOptions.zipsMapType = 'Ai3Y2Jwp';

          map = new ZDC.Map(
            document.getElementById("map"),
            mapOptions,
            function() {
              // コントロール追加
              map.addControl(new ZDC.ZoomButton('top-left'));
              map.addControl(new ZDC.ScaleBar('bottom-left'));
              // 現在方位の可視化＋「進行方向↑」のON/OFFトグル（attachCompassToggle で挙動を差し替える）。
              try { map.addControl(new ZDC.Compass('top-right')); } catch (e) { /* 非対応でも地図は出す */ }
              showMapLoading(false);   // 現在地中心で描けた時点で覆いを外す

              // 初期測位が取れていれば青ドットも出す（中心＝現在地なので位置は一致する）
              if (fix) showMyLocation(fix.lat, fix.lng);
              // モバイルは継続追跡を開始（青ドット更新＋追従）。二重起動はwatchIdで防止。
              // 初期測位に失敗していても開始する（歩き出して取れるようになるケースを拾う＝従来どおり）。
              if (isMobileUA() && navigator.geolocation) startLocationWatch();

              // クリック：グリッド記録モードON時はマスをトグル、OFF時は従来どおりピン追加。
              map.addEventListener("click", function(e) {
                if (gridMode) { toggleGridCell(e.latlng.lat, e.latlng.lng); return; }
                if (youtoOn) { if (e && e.latlng) queryYouto(e.latlng); return; } // 用途地域ON＝属性取得（ピン追加しない）
                pendingLatLng = { lat: e.latlng.lat, lng: e.latlng.lng };
                openPinModal();
              });

              // 地図移動・ズーム完了(idle)でグリッドを可視範囲だけ再描画（gridMode中のみ）。
              map.addEventListener("idle", function() { if (gridMode) redrawGrid(); });
              map.addEventListener("idle", function(){ relayoutVisiblePins(); });  // 可視範囲のピンだけ描く（範囲外は消す）
              map.addEventListener("idle", function(){ redrawActiveLayers(); }); // 用途地域ON中のみ追従再描画

              // 地図を指/マウスでドラッグしたら追従解除（プログラムのsetCenterは入力イベントを出さず誤検知しない）
              attachManualPanDetection();
              attachLocateLongPress();   // 📍長押し＝既定縮尺メニュー（地図が出来てから有効化）
              attachManualRotateDetection();  // 2本指ひねり＝手動操作 → 自動回転を一時解除
              attachCompassToggle();          // 右上コンパス＝進行方向↑のON/OFF（初期表示の反映もこの中）

              listenPins();
              loadSurveyGrids();   // 調査済みマスを先読み（gridMode ON時に即描画できるように）
            },
            function() {
              showMapLoading(false);
              showToast("地図の初期化に失敗しました", "error");
            }
          );
        });
      });
    }

    // ===== 用途地域の重畳（調査用）=====
    // 2026-07-14: ZENRIN WMS(有償) → 国交省 不動産情報ライブラリ XKT002(無料・GeoJSON) へ移行。
    //   ZENRIN 本契約から用途地域オプションを外すため（年約50万円の削減）。admin.html と同一実装。
    //   取得は Cloud Functions の youto プロキシ経由（APIキーは Secret Manager。コードに持たない）。
    //   ※XKT002 は「用途地域名／建蔽率／容積率」のみ。防火地域・高度地区は取得できない（承知の上）。
    //
    // 【既知のリスク・鍵の共用】この移行で WMS_KEY の const は消えたが、ZENRIN の鍵は
    //   14行目の zma_loader.js?key=... に残っており、実質的に公開されている。
    //   ZENRIN は「1契約1キー・公開範囲は契約内容でZENRIN側が制御」という設計なので、
    //   JS API 用と Web API 用で鍵を分けることはできない（＝プロキシに隠しても本質的な防御にならない）。
    //   認証は Referer だが、Referer はサーバから容易に詐称できるため防御力は限定的。
    //   → 打てる手は「防ぐ」ではなく「焼かれても青天井にしない」。ZENRIN に
    //     ①従量課金の上限設定 ②使用量急増のアラート ③不正利用時の請求の扱い
    //     を確認しておくこと。プロキシ化自体は Secret 管理・キャッシュの面で有効なので維持する。
    const YOUTO_API   = "https://youto-ptddjpvgeq-an.a.run.app";  // Cloud Functions youto プロキシ
    const YOUTO_MAX_TILES = 24;         // 1描画で取りに行くタイル数の上限（超えるならズームを1段引く）
    const youtoTileCache = new Map();   // "z/x/y" -> features[]（パン時の再取得を防ぐ）
    let   youtoFeatures  = [];          // 現在描画中のfeature（タップ判定にそのまま使う）

    // 用途地域13分類の色（youto_id は国土数値情報の用途地域分類コードと同一体系）
    const YOUTO_COLORS = {
      "1":"#7FBF7F", "2":"#A8D8A8", "3":"#C8E6A0", "4":"#E0F0B0",   // 低層/中高層 住居専用
      "5":"#F2EDA0", "6":"#F2E080", "7":"#F2D060", "8":"#B5E6B5",   // 住居/準住居/田園住居
      "9":"#F5B0A0", "10":"#F08080",                                 // 近隣商業/商業
      "11":"#C0A0C0", "12":"#A0C0E0", "13":"#80A0D0",               // 準工業/工業/工業専用
    };
    const YOUTO_FALLBACK = "#9CA3AF";   // 未知コードは灰色

    const ZOOM_READABLE = 20;  // ピン選択時に寄せる閾値ズーム（admin と統一）
    let youtoWidget = null, youtoRedrawing = false, youtoRedrawQueued = false;

    function layerBBoxArr(){ const b=map.getLatLngBounds(); const sw=map.latlngToWebMercator(b.getSouthWest()); const ne=map.latlngToWebMercator(b.getNorthEast()); return [sw[0],sw[1],ne[0],ne[1]]; }
    function removeYouto(){ if(youtoWidget){ try{ map.removeWidget(youtoWidget); }catch(e){} youtoWidget=null; } }

    // ===== 描画カリング（ビューポート＋過去周回）=====
    // 端末の重さは「地図に載っているウィジェット数」にほぼ比例する（1ピン＝marker＋#001ラベルの2個）。
    // 購読は全件のまま（lastPinDocs にメモリ保持）、描画だけを可視範囲＋バッファに絞る。
    // 範囲外は marker とラベルをウィジェットごと外す（removePinMarker が両方消す）。
    const VIEW_BUFFER_RATIO = 0.15;   // 可視範囲を上下左右にこの割合ぶん広げてからカリング（パン時のチラつき防止）
    let showPastRounds = false;       // 過去周回ピンの表示（既定OFF＝描画しない。旧ボタンでON）
    const LABEL_MIN_ZOOM = 16;        // #001番号ラベルはこのズーム以上でのみ描画（広域ではmarkerのみ＝1ピン ウィジェット1個）
    let labelsShown = null;           // ラベルを描いているか（ズーム閾値の状態）。跨いだら描画済みピンを描き直す

    // バッファ込みの可視範囲。取得できない場合は null（＝カリングせず従来どおり描く）。
    function viewBounds() {
      if (!map) return null;
      let b;
      try { b = map.getLatLngBounds(); } catch (e) { return null; }
      if (!b) return null;
      const sw = b.getSouthWest(), ne = b.getNorthEast();
      // 回転中ははみ出しぶんを上乗せする（heading=0 なら加算0＝従来どおり）。
      // これが無いと、回転時に画面の角に見えているピンがカリングで消える。
      const ratio = VIEW_BUFFER_RATIO + rotationBufferRatio();
      const dLat = (ne.lat - sw.lat) * ratio;
      const dLng = (ne.lng - sw.lng) * ratio;
      return { south: sw.lat - dLat, north: ne.lat + dLat, west: sw.lng - dLng, east: ne.lng + dLng };
    }
    function inViewBounds(data, vb) {
      const lat = Number(data.lat), lng = Number(data.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;   // 座標欠落は描けない
      if (!vb) return true;   // 範囲が取れない時は従来どおり描く（現場を止めない）
      return lat >= vb.south && lat <= vb.north && lng >= vb.west && lng <= vb.east;
    }
    // 描画対象＝「可視範囲内」かつ「（過去周回OFFなら）過去周回でない」。
    // 永久ピン(反社/NG)は isPastRound が常に false ＝ 過去周回OFFでも従来どおり常時表示。
    function shouldRenderPin(data, vb) {
      if (!showPastRounds && isPastRound(data)) return false;
      return inViewBounds(data, vb);
    }
    // 可視範囲の変化に追従して描画を差分更新（範囲内で未描画は追加／対象外は marker＋ラベルごと除去）。
    // 既に描画済みのピンは触らない＝パンのたびに全再生成しない。
    function relayoutVisiblePins() {
      if (!map) return;
      const vb = viewBounds();
      // #001ラベルはズーム閾値以上でのみ描く。閾値を跨いだら描画済みピンを消して描き直し、ラベル有無を更新。
      const showLabels = map.getZoom() >= LABEL_MIN_ZOOM;
      if (showLabels !== labelsShown) {
        labelsShown = showLabels;
        for (const id of Array.from(pinWidgetMap.keys())) removePinMarker(id);
      }
      const keep = new Set();
      lastPinDocs.forEach(p => {
        if (!shouldRenderPin(p.data, vb)) return;
        keep.add(p.id);
        if (!pinWidgetMap.has(p.id)) renderMarker(p.id, p.data);
      });
      for (const id of Array.from(pinWidgetMap.keys())) {
        if (!keep.has(id)) removePinMarker(id);
      }
    }

    // 物件マーカーを直近データから全再描画（onSnapshot と共用。重畳画像の上へ戻すため）
    // 全消し→描き直しだが、描くのは可視範囲内かつ表示対象のピンだけ。
    function renderAllMarkers(){
      if(!map) return;
      for (const id of Array.from(pinWidgetMap.keys())) {
        removePinMarker(id);
      }
      const vb = viewBounds();
      lastPinDocs.forEach(p => { if (shouldRenderPin(p.data, vb)) renderMarker(p.id, p.data); });
    }

    // 過去周回ピンの表示トグル（既定OFF）。ONで従来の薄色(opacity .45)表示に戻る。
    window.togglePastRounds = () => {
      showPastRounds = !showPastRounds;
      const btn = document.getElementById("pastBtn");
      if (btn) btn.classList.toggle("active", showPastRounds);
      relayoutVisiblePins();
      showToast(showPastRounds ? "過去周回ピン：表示" : "過去周回ピン：非表示（現在の周回のみ）",
                showPastRounds ? "warn" : "ok");
    };

    // ── 用途地域レイヤ（不動産情報ライブラリ XKT002 / GeoJSON）──────────────
    // XYZタイル方式（z=11〜15）。可視範囲を覆うタイルだけを取りに行くので、
    // 対象エリアが何府県に増えても取得量は変わらない（＝広域展開してもコストが増えない）。
    const lngToTileX = (lng,z) => Math.floor((lng+180)/360 * 2**z);
    const latToTileY = (lat,z) => {
      const r = lat*Math.PI/180;
      return Math.floor((1 - Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2 * 2**z);
    };

    // 可視範囲を YOUTO_MAX_TILES 枚以内で覆える最大の（＝最も詳細な）ズームを選ぶ。
    function pickYoutoZoom(){
      const b=map.getLatLngBounds(), sw=b.getSouthWest(), ne=b.getNorthEast();
      for(let z=15; z>=11; z--){
        const nx = lngToTileX(ne.lng,z) - lngToTileX(sw.lng,z) + 1;
        const ny = latToTileY(sw.lat,z) - latToTileY(ne.lat,z) + 1;
        if(nx*ny <= YOUTO_MAX_TILES) return z;
      }
      return -1;   // z=11でも覆えない＝引きすぎ
    }

    async function fetchYoutoTile(z,x,y){
      const key = `${z}/${x}/${y}`;
      if(youtoTileCache.has(key)) return youtoTileCache.get(key);
      const token = await auth.currentUser.getIdToken();
      const res = await fetch(`${YOUTO_API}?z=${z}&x=${x}&y=${y}`, { headers:{ Authorization:`Bearer ${token}` } });
      if(!res.ok) throw new Error(`youto ${res.status} (${key})`);
      const gj = await res.json();
      const feats = gj.features || [];
      youtoTileCache.set(key, feats);
      return feats;
    }

    async function drawYouto(){
      const z = pickYoutoZoom();
      if(z < 0){ showToast("用途地域：範囲が広すぎます。ズームインしてください","warn"); youtoFeatures=[]; return; }

      const b=map.getLatLngBounds(), sw=b.getSouthWest(), ne=b.getNorthEast();
      const x0=lngToTileX(sw.lng,z), x1=lngToTileX(ne.lng,z);
      const y0=latToTileY(ne.lat,z), y1=latToTileY(sw.lat,z);

      let feats=[];
      try{
        const jobs=[];
        for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) jobs.push(fetchYoutoTile(z,x,y));
        (await Promise.all(jobs)).forEach(fs => { feats = feats.concat(fs); });
      }catch(e){
        showToast("用途地域の取得に失敗しました","error"); console.error("youto fetch", e);
        youtoFeatures=[]; return;
      }
      youtoFeatures = feats;   // タップ判定はこの配列に対してローカルで行う（サーバ往復ゼロ）
      if(!feats.length) return;

      // ── canvas に描画（座標系は EPSG:3857。BBOX/投影とも map の関数に揃える）──
      const size = map.getMapSize();
      const [minx,miny,maxx,maxy] = layerBBoxArr();
      const cv = document.createElement("canvas");
      cv.width = size.width; cv.height = size.height;
      const ctx = cv.getContext("2d");

      const toPx = (lng,lat) => {
        const p = map.latlngToWebMercator(new ZDC.LatLng(lat,lng));
        return [ (p[0]-minx)/(maxx-minx)*size.width, (maxy-p[1])/(maxy-miny)*size.height ];
      };
      const pathRing = (ring) => {
        for(let i=0;i<ring.length;i++){
          const [px,py] = toPx(ring[i][0], ring[i][1]);
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
      };

      ctx.lineWidth = 1;
      for(const f of feats){
        const g = f.geometry; if(!g) continue;
        const color = YOUTO_COLORS[String(f.properties?.youto_id)] || YOUTO_FALLBACK;
        const polys = (g.type === "Polygon") ? [g.coordinates] : (g.type === "MultiPolygon" ? g.coordinates : []);
        if(!polys.length) continue;
        ctx.beginPath();
        for(const poly of polys) for(const ring of poly) pathRing(ring);   // ring[0]=外周 / ring[1..]=穴
        ctx.globalAlpha = 0.45; ctx.fillStyle = color; ctx.fill("evenodd");
        ctx.globalAlpha = 0.95; ctx.strokeStyle = color; ctx.stroke();
      }
      ctx.globalAlpha = 1;

      const id = "youto_gj_" + Date.now();
      const w = new ZDC.UserWidget(map.getLatLngBounds().getNorthWest(), {
        htmlSource: '<img id="'+id+'" src="" style="pointer-events:none">', propagation:true
      });
      map.addWidget(w); youtoWidget = w;
      document.getElementById(id).src = cv.toDataURL("image/png");
    }

    // ON中は用途地域を再描画し、グリッド→ピンを最前面へ積み直す。多重発火はコアレス。
    // 静止中のidle連発（addWidget/onSnapshot由来）で再描画ループ＝チラつきが起きるため、
    // 同一BBOX(＋ON状態)で既に描画済みなら何もしない（実際の移動時のみ再描画）。
    let lastYoutoKey = "";
    async function redrawActiveLayers(){
      if(!map) return;
      if(youtoRedrawing){ youtoRedrawQueued=true; return; }
      const key = youtoOn ? layerBBoxArr().map(n=>Math.round(n)).join(",") : "off";
      if(key===lastYoutoKey && (youtoOn ? !!youtoWidget : true)) return;
      youtoRedrawing=true;
      try{
        removeYouto();
        if(youtoOn){ await drawYouto(); if(gridMode) redrawGrid(); renderAllMarkers(); }
        lastYoutoKey = key;
      } finally {
        youtoRedrawing=false;
        if(youtoRedrawQueued){ youtoRedrawQueued=false; redrawActiveLayers(); }
      }
    }

    // ── タップ地点の用途地域（point-in-polygon をローカル判定。API往復なし）──
    function pointInRing(lng,lat,ring){
      let inside=false;
      for(let i=0,j=ring.length-1; i<ring.length; j=i++){
        const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
        if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
      }
      return inside;
    }
    function pointInPolygon(lng,lat,poly){
      if(!pointInRing(lng,lat,poly[0])) return false;          // 外周の外なら即false
      for(let k=1;k<poly.length;k++) if(pointInRing(lng,lat,poly[k])) return false;  // 穴の中はfalse
      return true;
    }
    function findYoutoAt(lng,lat){
      for(const f of youtoFeatures){
        const g=f.geometry; if(!g) continue;
        const polys = (g.type==="Polygon") ? [g.coordinates] : (g.type==="MultiPolygon" ? g.coordinates : []);
        for(const poly of polys) if(pointInPolygon(lng,lat,poly)) return f.properties;
      }
      return null;
    }

    function queryYouto(latlng){
      const box = document.getElementById("youtoInfo");
      if(!box) return;
      const close = '<span class="yi-close" onclick="closeYoutoInfo()">✕</span>';
      const p = findYoutoAt(latlng.lng, latlng.lat);
      if(!p){
        box.innerHTML = close + 'この地点に用途地域データなし（区域外／市街化調整区域の可能性）';
        box.style.display = "block"; return;
      }
      box.innerHTML = close
        + '<b>用途地域</b>：' + (p.use_area_ja || '-') + '<br>'
        + '建ぺい率：' + (p.u_building_coverage_ratio_ja || '-') + ' ／ 容積率：' + (p.u_floor_area_ratio_ja || '-') + '<br>'
        + '<span style="opacity:.65;font-size:11px">' + (p.city_name || '') + '　出典：国土交通省 不動産情報ライブラリ</span>';
      box.style.display = "block";
    }

    window.closeYoutoInfo = () => { const b=document.getElementById("youtoInfo"); if(b) b.style.display="none"; };
    function updateYoutoBanner(){
      const b=document.getElementById("youtoBanner");
      if(b) b.style.display = (youtoOn && !gridMode) ? "block" : "none";
    }
    window.toggleYouto = () => {
      youtoOn=!youtoOn;
      const btn=document.getElementById("youtoBtn"); if(btn) btn.classList.toggle("active",youtoOn);
      updateYoutoBanner();
      if(!youtoOn){ removeYouto(); closeYoutoInfo(); }
      redrawActiveLayers();
    };

    // ===== LISTEN PINS（第二便：自店のピンだけ購読。全店アカウント(@housemarket.com)のみ全件）=====
    function listenPins() {
      if (!map) return;
      if (pinsUnsub) pinsUnsub();   // 多重購読防止：既存リスナーを解除してから張り直す
      const base = collection(db, "pins");
      // 自店に絞る（全店アカウントのみ全件）。myBranchはloadMyBranchで確定済み。
      const src = isAllStore(currentUser && currentUser.email) ? base : query(base, where("branch", "==", myBranch));
      pinsUnsub = onSnapshot(src, snap => {
        // 担当者カラー・表示名はログイン時に1回読み済み（ここでは読まない）。
        lastPinDocs = snap.docs.map(d => ({ id:d.id, data:d.data() }));
        const vb = viewBounds();
        snap.docChanges().forEach(change => {
          const id = change.doc.id;
          const data = change.doc.data();
          if (change.type === "added" || change.type === "modified") {
            removePinMarker(id);
            // 可視範囲外／過去周回(OFF時)は描かない。範囲内に入ったら idle の relayoutVisiblePins が拾う。
            if (shouldRenderPin(data, vb)) renderMarker(id, data);
          } else if (change.type === "removed") {
            removePinMarker(id);
          }
        });
        renderJumpList();     // 「続きへ」ドロップダウンを最新ピンで再構築

      }, e => { /* オフライン/権限エラーは無視（再オンライン・再ログインで復帰） */ });
    }

    function removePinMarker(id) {
      const entry = pinWidgetMap.get(id);
      if (!entry) return;
      if (map) {
        if (entry.marker) { try { map.removeWidget(entry.marker); } catch (e) {} }
        if (entry.labelWidget) { try { map.removeWidget(entry.labelWidget); } catch (e) {} }
      }
      pinWidgetMap.delete(id);
    }

    function renderMarker(id, data) {
      removePinMarker(id);
      // 未定義ステータスでも落ちない・透明にならないようガード。
      const s = STATUS[data.status] || EXCLUDE_STATUS[data.status];
      // marker color precedence:
      // 1) Permanent pin (PERMANENT_COLOR)
      // 2) excludeCandidate (EXCLUDE_COLOR)
      // 3) status color (STATUS or EXCLUDE_STATUS)
      // マーカー本体は「カテゴリ色＋ステータス頭文字」。固定連番(seqNo)は
      // マーカー上のHTMLオーバーレイ(#001形式)で表示する（下の UserWidget）。
      // seqNo 無し（万一の旧データ）はステータス頭文字→"?"でフォールバック（落とさない）。
      const marker = new ZDC.Marker(
        new ZDC.LatLng(data.lat, data.lng),
        {
          color: isPermanentPin(data) ? PERMANENT_COLOR : (data.excludeCandidate ? EXCLUDE_COLOR : (s ? s.color : FALLBACK_COLOR)),
          text: s ? (s.text || s.label[0]) : "?",
        }
      );
      marker.pinId = id;
      marker.pinData = data;
      marker.addEventListener("click", function() {
        // 引いてたら閾値まで寄せ、寄ってたら維持（admin同ロジック）。現地で地番が読める倍率へ。
        const tz = Math.max(map.getZoom(), ZOOM_READABLE);
        map.setCenter(new ZDC.LatLng(data.lat, data.lng));
        if (tz !== map.getZoom()) map.setZoom(tz);
        openEditModal(id, data, marker);
      });
      map.addWidget(marker);

      let labelWidget = null;
      // ピン番号ラベル(#001形式)をマーカーの上にHTMLオーバーレイ表示。
      // seqNo が無い旧データには付けない。pointer-events:none でマーカークリックを邪魔しない。
      if (data.seqNo != null && map.getZoom() >= LABEL_MIN_ZOOM) {
        const label = "#" + String(data.seqNo).padStart(3, "0");
        // ラベル背景色：要確認赤 ＞ 永久黒 ＞ 除外候補(黄) ＞ 周回色
        const labelBg = data.excludeCandidate ? EXCLUDE_COLOR : labelColor(data);
        const labelOpacity = isPastRound(data) ? ".45" : "1";
        // 他社物件フラグは背景色（＝色優先順位）を上書きせず、🏢＋黄土枠で重畳表示（状態と両方見える）。
        const oc = data.otherCompany === true;
        const labelBorder = data.excludeCandidate ? `2px solid ${EXCLUDE_BORDER}` : (oc ? "2px solid #CA8A04" : "1px solid rgba(255,255,255,.65)");
        const seqLabel = new ZDC.UserWidget(
          new ZDC.LatLng(data.lat, data.lng),
          {
            htmlSource:
              '<div style="transform:translateX(-50%);white-space:nowrap;'
              + 'padding:1px 6px;border-radius:9px;'
              + 'background:' + labelBg + ';color:#fff;'
              + 'font-size:11px;font-weight:700;line-height:1.6;'
              + 'border:' + labelBorder + ';'
              + 'box-shadow:0 1px 3px rgba(0,0,0,.35);'
              + 'opacity:' + labelOpacity + ';'
              + 'pointer-events:none;">' + label + (oc ? ' 🏢' : '') + '</div>',
            offset: new ZDC.Point(0, -58),
            propagation: true,

        );

    // ===== PIN MODAL（新規）=====
